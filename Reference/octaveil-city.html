<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>OCTAVEIL · 0o10 — a mist city in base eight</title>
<style>
  :root{ --gold:#d9b265; --mist:#cfddd3; --panel:rgba(11,21,17,.56); --line:rgba(217,178,101,.38); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0e1713;
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; }
  canvas.webgl{ position:fixed; inset:0; display:block; touch-action:none; }
  #veil{ position:fixed; inset:0; z-index:40; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 32%, #23382e 0%, #0e1713 72%);
    transition:opacity 1.6s ease; display:flex; align-items:center; justify-content:center;
    color:#d9b265; font-size:11px; letter-spacing:.4em; text-transform:uppercase; }
  #veil.gone{ opacity:0; }
  #ui{ position:fixed; inset:0; z-index:30; pointer-events:none; color:var(--mist); }
  .panel{ position:absolute; top:max(12px, env(safe-area-inset-top)); left:12px;
    display:flex; gap:14px; align-items:center; padding:13px 16px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:32px 14px 32px 14px;            /* asymmetric rounded-corner motif */
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  h1{ margin:0; font-size:19px; font-weight:600; letter-spacing:.34em; color:#f0f5ef; }
  h1 b{ color:var(--gold); font-weight:600; }
  .sub{ font-size:9px; letter-spacing:.2em; opacity:.72; margin-top:3px; text-transform:uppercase; }
  .read{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--gold);
    margin-top:7px; letter-spacing:.05em; }
  .legend{ margin-top:8px; font-size:9.5px; line-height:1.75; letter-spacing:.05em; opacity:.92; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:3px 1px 3px 1px; margin-right:6px; }
  #glyphstrip{ opacity:.92; }
  #btns{ position:absolute; right:12px; bottom:max(12px, env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:8px; }
  button{ pointer-events:auto; cursor:pointer; border:1px solid var(--line);
    background:var(--panel); color:var(--mist); padding:11px 16px;
    font:600 10px/1 "Avenir Next","Segoe UI",system-ui,sans-serif; letter-spacing:.24em;
    border-radius:24px 10px 24px 10px;            /* asymmetric rounded-corner motif */
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:all .18s ease; }
  button:hover{ border-color:var(--gold); color:#fff; }
  button.on{ background:rgba(217,178,101,.24); color:#ffe9bd; }
  #hint{ position:absolute; left:50%; bottom:max(14px, env(safe-area-inset-bottom));
    transform:translateX(-50%); font-size:9px; letter-spacing:.22em; text-transform:uppercase;
    opacity:.8; background:var(--panel); padding:8px 16px; white-space:nowrap;
    border-radius:20px 8px 20px 8px; border:1px solid rgba(217,178,101,.2);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  #joy{ position:fixed; width:118px; height:118px; z-index:35; pointer-events:none; display:none;
    border:1.5px solid rgba(217,178,101,.55); border-radius:60px 60px 60px 26px;
    background:rgba(217,178,101,.06); }
  #knob{ position:absolute; width:46px; height:46px; left:36px; top:36px;
    border-radius:23px 23px 23px 10px; background:rgba(217,178,101,.35);
    border:1px solid rgba(255,233,189,.6); }
  @media (max-width:560px){ .legend{ display:none; } h1{ font-size:15px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>

<div id="ui">

    <div>
      <h1>OCTA<b>VEIL</b></h1>
      <div class="sub">step-city of the mist birch · base 0o10 survey</div>
      <div class="read" id="readout">X 0o0 · Z 0o0 · ALT 0o0</div>
      <div class="legend">
        <span class="dot" style="background:#1d403a"></span>dwellings &amp; spires — green / gold<br/>
        <span class="dot" style="background:#66452f"></span>communal kitchens — brown / beige<br/>
        <span class="dot" style="background:#e8ebe6"></span>canoe transit — white / grey<br/>
        <span class="dot" style="background:#d9b265"></span>script reads bottom → top
      </div>

    <canvas id="glyphstrip" width="52" height="172"></canvas>
  </div>
  <div id="btns">
    <button id="bmode">MODE · WALK</button>

  </div>

</div>
<div id="joy"><div id="knob"></div></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

window.addEventListener('error', e => {
  const v = document.getElementById('veil'); v.classList.remove('gone'); v.textContent = '0oERR · ' + e.message;
});

/* ================= base-eight toolkit ================= */
const o8 = s => {                                   /* octal-fraction parser: o8('1.4') = 1.5 */
  s = String(s); let n = 1;
  if (s[0] === '-') { n = -1; s = s.slice(1); }
  const d = s.indexOf('.');
  const ip = d < 0 ? s : s.slice(0, d), fp = d < 0 ? '' : s.slice(d + 1);
  let v = ip ? parseInt(ip, 0o10) : 0;
  for (let i = 0; i < fp.length; i++) v += parseInt(fp[i], 0o10) * Math.pow(0o10, -(i + 1));
  return n * v;
};
const c8 = (r, g, b) => new THREE.Color().setRGB(r / 0o377, g / 0o377, b / 0o377, THREE.SRGBColorSpace);
const OCT = n => (n < 0 ? '-0o' : '0o') + Math.abs(Math.round(n)).toString(0o10);
let _s = 0o752;                                     /* deterministic LCG, seeded in octal */
const rnd = () => { _s = (_s * 0o1663 + 0o1015) % 0o100000; return _s / 0o100000; };
const smooth = t => t * t * (0o3 - 0o2 * t);
const NI = g => g.index ? g.toNonIndexed() : g;     /* normalize for merging */

/* ================= world constants (octal) ================= */
const WORLD = 0o400, HALF = 0o200;                  /* 256 × 256 survey */
const WATER_Y = -o8('1.2');
const EYE = o8('3.1');
const TH = 0o3;                                     /* every tier is exactly 0o3 tall */
const RIVER_W = 0o7, RIVER_I = 0o20;

/* ================= renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 0o2));
renderer.setSize(innerWidth, innerHeight);
renderer.domElement.className = 'webgl';
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = o8('1.1');
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOGC = c8(0o307, 0o324, 0o315);
scene.background = FOGC.clone();
const MISTS = [o8('0.0022'), o8('0.0044'), o8('0.011')];
let mistIdx = 0o1;
scene.fog = new THREE.FogExp2(FOGC.clone(), MISTS[mistIdx]);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), o8('0.04')).texture;

const camera = new THREE.PerspectiveCamera(0o110, innerWidth / innerHeight, o8('0.1'), 0o2000);

const hemi = new THREE.HemisphereLight(c8(0o317,0o337,0o327), c8(0o104,0o124,0o104), o8('0.52'));
scene.add(hemi);
const sun = new THREE.DirectionalLight(c8(0o360,0o364,0o350), o8('1.0'));
sun.position.set(0o100, 0o140, 0o60);
sun.castShadow = true;
sun.shadow.mapSize.set(0o2000, 0o2000);
sun.shadow.camera.left = -0o220; sun.shadow.camera.right = 0o220;
sun.shadow.camera.top = 0o220; sun.shadow.camera.bottom = -0o220;
sun.shadow.camera.near = 0o10; sun.shadow.camera.far = 0o500;
sun.shadow.bias = -o8('0.00016'); sun.shadow.normalBias = o8('0.6');
scene.add(sun);
scene.add(new THREE.DirectionalLight(c8(0o310,0o330,0o340), o8('0.22'))).position.set(-0o60, 0o50, -0o100);

/* ================= noise & geography ================= */
const hhash = (x, z) => { const s = Math.sin(x * 0o177 + z * 0o467) * 0o246543; return s - Math.floor(s); };
function vnoise(x, z){
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = smooth(xf), v = smooth(zf);
  const a = hhash(xi,zi), b = hhash(xi+1,zi), c = hhash(xi,zi+1), d = hhash(xi+1,zi+1);
  return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
}
function fbm(x, z){ let v = 0, a = o8('0.5'), f = 1;
  for (let i = 0; i < 0o3; i++){ v += a * vnoise(x*f, z*f); f *= 0o2; a *= o8('0.4'); } return v; }

const riverX = z => 0o24 * Math.sin(z * o8('0.013')) + 0o12 * Math.sin(z * o8('0.005') + 0o2);

function baseH(x, z){
  let h = (fbm(x * o8('0.006'), z * o8('0.006')) - o8('0.4')) * 0o5;
  const d = Math.abs(x - riverX(z));
  if (d < RIVER_I){ const s = smooth(1 - d / RIVER_I); h = h * (1 - s) + (-o8('3')) * s; }
  return h;
}
const pads = [], pits = [];
function groundH(x, z){
  let h = baseH(x, z);
  for (const p of pads){ const d = Math.hypot(x - p.x, z - p.z);
    if (d < p.r){ const s = smooth(1 - d / p.r); h = h * (1 - s) + p.h * s; } }
  for (const p of pits){ const d = Math.hypot(x - p.x, z - p.z);
    if (d < p.r){ h -= p.depth * smooth(1 - d / p.r); } }
  return h;
}
function pathY(x, z){
  const g = groundH(x, z) + o8('0.3');
  const d = Math.abs(x - riverX(z));
  const t = Math.min(1, Math.max(0, 1 - (d - RIVER_W * o8('0.6')) / RIVER_I));
  const s = smooth(t);
  return g * (1 - s) + (WATER_Y + o8('2.2')) * s;   /* rises into a bridge over water */
}
function walkH(x, z){
  let h = groundH(x, z), near = false;
  for (const b of LINES) if (Math.abs(x - b) < 0o6 || Math.abs(z - b) < 0o6){ near = true; break; }
  if (near) h = Math.max(h, pathY(x, z));
  return Math.max(h, WATER_Y + o8('1.4'));
}

/* ================= city layout (grid flowing with geography) ================= */
const LINES = [-0o140, -0o60, 0o0, 0o60, 0o140];
const wob = (b, t) => b + 0o3 * Math.sin(t * o8('0.01') + b * o8('0.1'));

const lots = [];
for (let i = 0; i < 0o4; i++) for (let j = 0; j < 0o4; j++){
  const cx = (LINES[i] + LINES[i+1]) / 0o2 + (rnd() - o8('0.4')) * 0o10;
  const cz = (LINES[j] + LINES[j+1]) / 0o2 + (rnd() - o8('0.4')) * 0o10;
  if (Math.abs(cx - riverX(cz)) < 0o30) continue;   /* river lots stay wild */
  lots.push({ x:cx, z:cz });
}
lots.forEach(l => l.dc = Math.hypot(l.x, l.z));
lots.sort((a, b) => a.dc - b.dc);
lots.slice(0, 0o3).forEach(l => l.type = 'spire');
const rest0 = lots.slice(0o3).sort((a, b) =>
  Math.abs(a.x - riverX(a.z)) - Math.abs(b.x - riverX(b.z)));
rest0.slice(0, 0o2).forEach(l => l.type = 'hub');
const rest1 = rest0.slice(0o2);
for (let k = 0; k < 0o2 && rest1.length; k++) rest1.splice((rnd() * rest1.length) | 0, 1)[0].type = 'food';
rest1.forEach(l => l.type = 'house');
for (let k = 0; k < 0o2; k++){                      /* two lots left as birch groves */
  const hs = rest1.filter(l => !l.grove);
  if (hs.length) hs[(rnd() * hs.length) | 0].grove = true;
}
const built = lots.filter(l => !l.grove);

function specFor(l){
  if (l.type === 'spire') return { w:0o13, d:0o13, tiers:0o15, shrink:o8('0.44'), wall:'houseWall', frame:'gold', diamond:false };
  if (l.type === 'hub')   return { w:0o20, d:0o16, tiers:0o4,  shrink:o8('1.2'),  wall:'hubWall',   frame:'grey', diamond:false };
  if (l.type === 'food')  return { w:0o20, d:0o16, tiers:0o3,  shrink:o8('1.2'),  wall:'foodWall',  frame:'beige', diamond:false };
  const w = 0o13 + ((rnd() * 0o3) | 0);
  return { w, d:w - 0o2, tiers:0o3 + ((rnd() * 0o3) | 0), shrink:o8('1.1'),
           wall:'houseWall', frame:'gold', diamond:rnd() < o8('0.5') };
}
for (const l of built){
  l.spec = specFor(l);
  let dxm = 1e9, dzm = 1e9, lx = 0, lz = 0;
  for (const b of LINES){
    if (Math.abs(l.x - b) < dxm){ dxm = Math.abs(l.x - b); lx = b; }
    if (Math.abs(l.z - b) < dzm){ dzm = Math.abs(l.z - b); lz = b; }
  }
  l.yaw = dxm < dzm ? (l.x > lx ? -Math.PI / 0o2 : Math.PI / 0o2) : (l.z > lz ? Math.PI : 0);
  const pr = Math.max(l.spec.w, l.spec.d) * o8('0.7') + 0o5;
  l.pad = { x:l.x, z:l.z, r:pr, h:baseH(l.x, l.z) };
  pads.push(l.pad);
  if (l.spec.diamond)
    pits.push({ x:l.x, z:l.z, r:pr * o8('0.6'), depth:l.spec.tiers * TH + 0o2, padH:l.pad.h });
}

/* ================= materials ================= */
const std = (color, rough, metal, envI, extra={}) => new THREE.MeshStandardMaterial(
  Object.assign({ color, roughness:rough, metalness:metal || 0,
    envMapIntensity:envI == null ? o8('0.4') : envI, side:THREE.DoubleSide }, extra));
const MAT = {
  houseWall: std(c8(0o35,0o100,0o072), o8('0.46'), o8('0.1')),
  foodWall:  std(c8(0o146,0o105,0o062), o8('0.54'), o8('0.04')),
  hubWall:   std(c8(0o356,0o357,0o352), o8('0.4'),  o8('0.06')),
  gold:      std(c8(0o327,0o244,0o120), o8('0.3'),  o8('0.72'), o8('1.3')),
  beige:     std(c8(0o332,0o307,0o236), o8('0.52'), o8('0.14')),
  grey:      std(c8(0o227,0o231,0o234), o8('0.36'), o8('0.5'),  o8('0.7')),
  dark:      std(c8(0o22,0o36,0o30),    o8('0.7'),  0),
  diorite:   std(c8(0o351,0o347,0o337), o8('0.3'),  o8('0.12'), o8('0.6')),
  andesite:  std(c8(0o146,0o150,0o153), o8('0.7'),  o8('0.04')),
  brown:     std(c8(0o122,0o102,0o062), o8('0.6'),  o8('0.04')),
};

/* ================= terrain ================= */
{
  const g = new THREE.PlaneGeometry(WORLD, WORLD, 0o240, 0o240);
  g.rotateX(-Math.PI / 0o2);
  const pos = g.attributes.position, cols = [];
  const grassA = c8(0o102,0o122,0o100), grassB = c8(0o125,0o146,0o113),
        lich = c8(0o207,0o227,0o170), wet = c8(0o127,0o131,0o120), pitC = c8(0o40,0o56,0o46);
  const col = new THREE.Color();
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), z = pos.getZ(i), y = groundH(x, z);
    pos.setY(i, y);
    col.copy(grassA).lerp(grassB, Math.min(1, fbm(x * o8('0.02') + 0o11, z * o8('0.02')) * o8('1.4')));
    if (fbm(x * o8('0.06') + 0o40, z * o8('0.06')) > o8('0.56')) col.lerp(lich, o8('0.5'));
    const d = Math.abs(x - riverX(z));
    if (d < RIVER_I + 0o3) col.lerp(wet, Math.max(0, 1 - (d - RIVER_W) / RIVER_I) * o8('0.6'));
    for (const p of pits){ const pd = Math.hypot(x - p.x, z - p.z);
      if (pd < p.r) col.lerp(pitC, smooth(1 - pd / p.r) * o8('0.7')); }
    cols.push(col.r, col.g, col.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 0o3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:o8('0.76'), metalness:0, envMapIntensity:o8('0.3') }));
  m.receiveShadow = true;
  scene.add(m);
}

/* ================= water ribbon ================= */
const waterMat = new THREE.MeshStandardMaterial({ color:c8(0o105,0o143,0o133),
  roughness:o8('0.14'), metalness:o8('0.2'), transparent:true, opacity:o8('0.66'),
  depthWrite:false, envMapIntensity:o8('1.0') });
{
  const N = 0o200, pts = [], idx = [];
  for (let i = 0; i <= N; i++){
    const z = -HALF + WORLD * i / N, cx = riverX(z);
    pts.push(cx - RIVER_W - 1, WATER_Y, z, cx + RIVER_W + 1, WATER_Y, z);
    if (i < N){ const a = i * 0o2; idx.push(a, a+1, a+2, a+1, a+3, a+2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 0o3));
  g.setIndex(idx); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, waterMat));
}

/* ================= the vertical script (bottom → top) ================= */
function asymRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r[0], y);
  ctx.lineTo(x + w - r[1], y); ctx.quadraticCurveTo(x + w, y, x + w, y + r[1]);
  ctx.lineTo(x + w, y + h - r[2]); ctx.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
  ctx.lineTo(x + r[3], y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r[3]);
  ctx.lineTo(x, y + r[0]); ctx.quadraticCurveTo(x, y, x + r[0], y);
  ctx.closePath();
}
function glyphBlock(ctx, x, y, w, h, ink){
  ctx.save(); ctx.strokeStyle = ink; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = w * o8('0.1');
  const vl = (fx, y0, y1, b) => { ctx.beginPath();
    ctx.moveTo(x + w*fx, y + h*y0);
    ctx.quadraticCurveTo(x + w*(fx + b), y + h*(y0 + y1)/0o2, x + w*(fx + b*o8('0.2')), y + h*y1);
    ctx.stroke(); };
  const hk = (x0, x1, fy, dp) => { ctx.beginPath();
    ctx.moveTo(x + w*x0, y + h*fy);
    ctx.quadraticCurveTo(x + w*(x0 + x1)/0o2, y + h*(fy + dp), x + w*x1, y + h*(fy + dp*o8('0.2')));
    ctx.stroke(); };
  if (rnd() < o8('0.5')){                              /* full block */
    const n = 0o2 + ((rnd() * 0o2) | 0);
    for (let i = 0; i < n; i++)
      vl(o8('0.2') + i * o8('0.6') / Math.max(1, n - 1), o8('0.1'), o8('0.72'), (rnd() - o8('0.4')) * o8('0.4'));
    if (rnd() < o8('0.5')) hk(o8('0.12'), o8('0.7'), o8('0.16') + rnd() * o8('0.1'), o8('0.3'));
  } else {                                             /* left half full, right top only */
    vl(o8('0.14'), o8('0.1'), o8('0.72'), (rnd() - o8('0.4')) * o8('0.3'));
    vl(o8('0.32'), o8('0.14'), o8('0.7'), (rnd() - o8('0.4')) * o8('0.3'));
    vl(o8('0.6'), o8('0.1'), o8('0.4'), (rnd() - o8('0.4')) * o8('0.2'));
    hk(o8('0.46'), o8('0.72'), o8('0.24'), o8('0.26'));
  }
  ctx.restore();
}
function drawScript(ctx, W, H, ink, frame){
  if (frame){ ctx.strokeStyle = frame; ctx.lineWidth = Math.max(2, W * o8('0.02'));
    asymRect(ctx, W*o8('0.06'), H*o8('0.03'), W*o8('0.7'), H*o8('0.754'),
             [W*o8('0.2'), W*o8('0.1'), W*o8('0.2'), W*o8('0.1')]); ctx.stroke(); }
  const bw = W * o8('0.34'), bh = bw * o8('1.5'), gap = bh * o8('0.16');
  const n = Math.max(0o2, Math.floor((H * o8('0.7')) / (bh + gap)));
  let y = H * o8('0.74') - bh;                         /* first glyph sits low… */
  for (let b = 0; b < n; b++){                         /* …reading rises upward */
    const cx = W / 0o2 + (rnd() - o8('0.4')) * W * o8('0.1');
    glyphBlock(ctx, cx - bw / 0o2, y, bw, bh, ink);
    y -= (bh + gap);
  }
}
function scriptTexture(){
  const cv = document.createElement('canvas'); cv.width = 0o300; cv.height = 0o470;
  drawScript(cv.getContext('2d'), cv.width, cv.height, '#173b2e', '#c9a254');
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 0o4;
  return t;
}
const signTex = [scriptTexture(), scriptTexture(), scriptTexture(), scriptTexture()];

/* ================= shapes for entrances ================= */
function roundedPoly(pts, rs){
  const s = new THREE.Shape(), n = pts.length;
  for (let i = 0; i < n; i++){
    const p0 = pts[(i + n - 1) % n], p1 = pts[i], p2 = pts[(i + 1) % n], r = rs[i];
    const v1x = p1[0]-p0[0], v1y = p1[1]-p0[1], l1 = Math.hypot(v1x, v1y);
    const v2x = p2[0]-p1[0], v2y = p2[1]-p1[1], l2 = Math.hypot(v2x, v2y);
    const ax = p1[0] - v1x/l1*r, ay = p1[1] - v1y/l1*r;
    const bx = p1[0] + v2x/l2*r, by = p1[1] + v2y/l2*r;
    if (i === 0) s.moveTo(ax, ay); else s.lineTo(ax, ay);
    s.quadraticCurveTo(p1[0], p1[1], bx, by);
  }
  s.closePath(); return s;
}
const trapShape = (wb, wt, h, r) =>
  roundedPoly([[-wb/2,0],[wb/2,0],[wt/2,h],[-wt/2,h]], [r*o8('0.6'), r*o8('0.6'), r, r]);

    const plat = new RoundedBoxGeometry(o.w + 0o6, o8('0.5'), 0o12, 0o2, o8('0.2'));

      const post = new THREE.Mesh(new THREE.CylinderGeometry(o8('0.12'), o8('0.14'), o8('2.4'), 0o6), MAT.gold);
      post.position.set(sx * o8('0.7'), o8('1.2'), 0); sg.add(post);

  alongZ ? dummy.rotateX(-pitch) : dummy.rotateZ(pitch);

      const t = s / 0o10, px = 64 + (tipx-64)*t*t, py = 124 + (tipy-124)*t*t;
      const ll = (1-t) * 12 + 2;
      fx.beginPath(); fx.moveTo(px, py); fx.lineTo(px - ll, py + ll*o8('0.3'));
      fx.moveTo(px, py); fx.lineTo(px + ll, py + ll*o8('0.3')); fx.stroke();
    }
  }
  const ft = new THREE.CanvasTexture(fc); ft.colorSpace = THREE.SRGBColorSpace;
  const p1 = new THREE.PlaneGeometry(o8('1.5'), o8('1.1')); p1.translate(0, o8('0.44'), 0);
  const p2 = p1.clone(); p2.rotateY(Math.PI / 0o2);
  const fg = mergeGeometries([NI(p1), NI(p2)]);
  const N = 0o500, fernI = new THREE.InstancedMesh(fg,
    new THREE.MeshStandardMaterial({ map:ft, alphaTest:o8('0.4'), side:THREE.DoubleSide,
      roughness:o8('0.7') }), N);
  let placed = 0, guard = 0;
  while (placed < N && guard++ < 0o6000){
    const x = (rnd() - o8('0.4')) * WORLD * o8('0.76'), z = (rnd() - o8('0.4')) * WORLD * o8('0.76');
    if (!clearOfCity(x, z, 0o6)) continue;
    dummy.position.set(x, groundH(x, z), z);
    dummy.rotation.set(0, rnd() * Math.PI, 0);
    const s = o8('0.6') + rnd() * o8('1'); dummy.scale.set(s, s, s);
    dummy.updateMatrix(); fernI.setMatrixAt(placed++, dummy.matrix);
  }
  fernI.count = placed; scene.add(fernI);
}
{ /* lichens */
  const N = 0o300, lichI = new THREE.InstancedMesh(new THREE.CircleGeometry(o8('0.4'), 0o10),
    new THREE.MeshStandardMaterial({ roughness:o8('1'), polygonOffset:true, polygonOffsetFactor:-1 }), N);
  const lA = c8(0o267,0o307,0o217), lB = c8(0o237,0o270,0o244), cc = new THREE.Color();
  let placed = 0, guard = 0;
  while (placed < N && guard++ < 0o4000){
    const x = (rnd() - o8('0.4')) * WORLD * o8('0.76'), z = (rnd() - o8('0.4')) * WORLD * o8('0.76');
    if (!clearOfCity(x, z, 0o5)) continue;
    dummy.position.set(x, groundH(x, z) + o8('0.03'), z);
    dummy.rotation.set(-Math.PI/2, 0, rnd()*Math.PI);
    const s = o8('0.5') + rnd() * o8('1.2'); dummy.scale.set(s, s, s);
    dummy.updateMatrix(); lichI.setMatrixAt(placed, dummy.matrix);
    lichI.setColorAt(placed, cc.copy(lA).lerp(lB, rnd()));
    placed++;
  }
  lichI.count = placed; lichI.instanceColor.needsUpdate = true;
  scene.add(lichI);
}
{ /* rocks */
  const rockG = [];
  for (let i = 0; i < 0o20; i++){
    let x, z, tries = 0;
    do {
      z = (rnd() - o8('0.4')) * WORLD * o8('0.7');
      x = rnd() < o8('0.5') ? riverX(z) + (rnd() < o8('0.5') ? -1 : 1) * (RIVER_W + 0o4 + rnd()*0o14)
                            : (rnd() - o8('0.4')) * WORLD * o8('0.7');
    } while (!clearOfCity(x, z, 0o6) && tries++ < 0o40);
    if (tries >= 0o40) continue;
    const r = o8('0.7') + rnd() * o8('1.6');
    const g = new THREE.IcosahedronGeometry(r, 0o1), pa = g.attributes.position;
    for (let v = 0; v < pa.count; v++){
      const j = o8('0.2');
      pa.setXYZ(v, pa.getX(v)*(1+(rnd()-o8('0.4'))*j), pa.getY(v)*(1+(rnd()-o8('0.4'))*j), pa.getZ(v)*(1+(rnd()-o8('0.4'))*j));
    }
    g.computeVertexNormals();
    g.translate(x, groundH(x, z) + r * o8('0.2'), z);
    rockG.push(NI(g));
  }
  if (rockG.length){
    const rm = new THREE.Mesh(mergeGeometries(rockG),
      new THREE.MeshStandardMaterial({ color:c8(0o212,0o214,0o210), roughness:o8('0.76'), flatShading:true }));
    rm.castShadow = rm.receiveShadow = true; scene.add(rm);
  }
}

/* ================= ground mist ================= */
const mistSprites = [];
{
  const mc = document.createElement('canvas'); mc.width = mc.height = 0o200;
  const mx = mc.getContext('2d');
  const g = mx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(226,236,228,.55)'); g.addColorStop(1,'rgba(226,236,228,0)');
  mx.fillStyle = g; mx.fillRect(0,0,128,128);
  const mt = new THREE.CanvasTexture(mc); mt.colorSpace = THREE.SRGBColorSpace;
  for (let i = 0; i < 0o40; i++){
    const sm = new THREE.SpriteMaterial({ map:mt, transparent:true, depthWrite:false,
      opacity:o8('0.06') + rnd() * o8('0.06') });
    const sp = new THREE.Sprite(sm);
    const x = (rnd() - o8('0.4')) * WORLD * o8('0.7'), z = (rnd() - o8('0.4')) * WORLD * o8('0.7');
    const s = 0o50 + rnd() * 0o70;
    sp.scale.set(s, s * o8('0.4'), 1);
    sp.position.set(x, groundH(x, z) + o8('2') + rnd() * 0o4, z);
    mistSprites.push({ sp, bx:x, ph:rnd() * 0o10, amp:0o6 + rnd() * 0o10, spd:o8('0.02') + rnd()*o8('0.04') });
    scene.add(sp);
  }
  pits.forEach(p => {
    const sm = new THREE.SpriteMaterial({ map:mt, transparent:true, depthWrite:false, opacity:o8('0.2') });
    const sp = new THREE.Sprite(sm);
    sp.scale.set(p.r * o8('2'), p.r * o8('0.7'), 1);
    sp.position.set(p.x, p.padH - p.depth * o8('0.3'), p.z);
    scene.add(sp);
  });
}

/* ================= canoes — same design language as the architecture ================= */
const canoes = [];
function makeCanoe(){
  const L = 0o7, W = o8('1.6'), H = o8('0.66');
  const s = new THREE.Shape();
  s.moveTo(-L/2, 0);
  s.quadraticCurveTo(-L*o8('0.2'),  W/2, 0,  W/2);
  s.quadraticCurveTo( L*o8('0.2'),  W/2, L/2, 0);
  s.quadraticCurveTo( L*o8('0.2'), -W/2, 0, -W/2);
  s.quadraticCurveTo(-L*o8('0.2'), -W/2, -L/2, 0);
  const ex = { depth:H, bevelEnabled:true, bevelThickness:o8('0.14'), bevelSize:o8('0.2'),
               bevelSegments:0o2, steps:0o1 };
  const hullG = new THREE.ExtrudeGeometry(s, ex); hullG.rotateX(-Math.PI/0o2);
  const rimG = new THREE.ExtrudeGeometry(s, { ...ex, depth:o8('0.1'), bevelThickness:o8('0.06') });
  rimG.rotateX(-Math.PI/0o2); rimG.scale(o8('1.06'), 1, o8('1.06')); rimG.translate(0, H + o8('0.1'), 0);
  const innG = new THREE.ExtrudeGeometry(s, { ...ex, depth:o8('0.1'), bevelEnabled:false });
  innG.rotateX(-Math.PI/0o2); innG.scale(o8('0.72'), 1, o8('0.72')); innG.translate(0, H + o8('0.06'), 0);
  const g = new THREE.Group();
  const hull = new THREE.Mesh(NI(hullG), MAT.houseWall);
  const rim = new THREE.Mesh(NI(rimG), MAT.gold);
  const inn = new THREE.Mesh(NI(innG), MAT.dark);
  hull.castShadow = true;
  const prow = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
    new THREE.Vector3(L/2 - o8('0.2'), H*o8('0.6'), 0),
    new THREE.Vector3(L/2 + o8('0.3'), H + o8('0.4'), 0),
    new THREE.Vector3(L/2 + o8('0.5'), H + o8('1'), 0) ]), 0o10, o8('0.12'), 0o6), MAT.gold);
  const seat = new THREE.Mesh(new RoundedBoxGeometry(o8('0.3'), o8('0.12'), W*o8('0.7'), 0o2, o8('0.05')), MAT.brown);
  seat.position.y = H * o8('0.7');
  g.add(hull, rim, inn, prow, seat);
  return g;
}
for (let i = 0; i < 0o4; i++){
  const g = makeCanoe(); scene.add(g);
  canoes.push({ g, lane:(i % 0o2 ? 1 : -1) * o8('1.6'), ph:rnd() * 0o20,
                spd:o8('0.04') + rnd() * o8('0.03'), moored:false });
}
docks.slice(0, 0o3).forEach((dk, i) => {
  const g = makeCanoe();
  const z = dk.z + o8('6'), x = riverX(z) + (i % 0o2 ? -1 : 1) * o8('3');
  g.position.set(x, WATER_Y + o8('0.1'), z);
  g.rotation.y = Math.atan2(riverX(z + 1) - riverX(z - 1), 0o2) + o8('0.2');
  scene.add(g);
  canoes.push({ g, moored:true, ph:i });
});

/* ================= controls & camera ================= */
const isCoarse = matchMedia('(pointer:coarse)').matches;
document.getElementById('hint').textContent = isCoarse
  ? 'left thumb · move — right thumb · look'
  : 'drag · look — WASD · move — wheel · glide — F · fly';

const cam = { yaw:0, pitch:-o8('0.1'), pos:new THREE.Vector3(), fly:false };
let cinema = true;
const keys = new Set();
const joy = { id:null, ox:0, oy:0, x:0, y:0 };
let lookId = null, lx = 0, ly = 0;
const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');

function setStart(){
  cam.pos.set(0o42, 0, 0o64);
  cam.pos.y = walkH(cam.pos.x, cam.pos.z) + EYE;
  cam.yaw = Math.atan2(cam.pos.x, cam.pos.z);
  cam.pitch = -o8('0.06');
}
function firstInput(){ if (cinema){ cinema = false; setStart(); } }

const cnv = renderer.domElement;
cnv.addEventListener('pointerdown', e => {
  firstInput();
  if (e.pointerType === 'touch' && e.clientX < innerWidth * o8('0.44') && joy.id === null){
    joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = joy.y = 0;
    joyEl.style.display = 'block';
    joyEl.style.left = (e.clientX - 59) + 'px'; joyEl.style.top = (e.clientY - 59) + 'px';
  } else if (lookId === null){ lookId = e.pointerId; lx = e.clientX; ly = e.clientY; }
  cnv.setPointerCapture(e.pointerId);
});
cnv.addEventListener('pointermove', e => {
  if (e.pointerId === joy.id){
    const R = 0o70;
    joy.x = Math.max(-1, Math.min(1, (e.clientX - joy.ox) / R));
    joy.y = Math.max(-1, Math.min(1, (joy.oy - e.clientY) / R));
    knob.style.left = (36 + joy.x * 34) + 'px'; knob.style.top = (36 - joy.y * 34) + 'px';
  } else if (e.pointerId === lookId){
    cam.yaw -= (e.clientX - lx) * o8('0.002');
    cam.pitch = Math.max(-o8('1.26'), Math.min(o8('1.26'), cam.pitch - (e.clientY - ly) * o8('0.002')));
    lx = e.clientX; ly = e.clientY;
  }
});
const endP = e => {
  if (e.pointerId === joy.id){ joy.id = null; joy.x = joy.y = 0; joyEl.style.display = 'none';
    knob.style.left = '36px'; knob.style.top = '36px'; }
  if (e.pointerId === lookId) lookId = null;
};
cnv.addEventListener('pointerup', endP);
cnv.addEventListener('pointercancel', endP);
cnv.addEventListener('wheel', e => {
  firstInput(); e.preventDefault();
  const d = new THREE.Vector3(-Math.sin(cam.yaw) * Math.cos(cam.pitch), Math.sin(cam.pitch),
                              -Math.cos(cam.yaw) * Math.cos(cam.pitch));
  cam.pos.addScaledVector(d, -e.deltaY * o8('0.01') * (cam.fly ? o8('2') : 1));
}, { passive:false });
addEventListener('keydown', e => {
  firstInput(); keys.add(e.code);
  if (e.code === 'KeyF') toggleMode();
  if (e.code === 'KeyR') setStart();
});
addEventListener('keyup', e => keys.delete(e.code));

const bmode = document.getElementById('bmode'), bmist = document.getElementById('bmist');
function toggleMode(){
  cam.fly = !cam.fly;
  bmode.textContent = cam.fly ? 'MODE · FLY' : 'MODE · WALK';
  bmode.classList.toggle('on', cam.fly);
}
bmode.addEventListener('click', () => { firstInput(); toggleMode(); });
bmist.addEventListener('click', () => {
  mistIdx = (mistIdx + 1) % 0o3;
  scene.fog.density = MISTS[mistIdx];
  bmist.textContent = 'MIST · 0o' + (mistIdx + 1).toString(0o10);
});
document.getElementById('breset').addEventListener('click', () => { cinema = false; setStart(); });

/* HUD glyph strip — decorative vertical script column */
{
  const c = document.getElementById('glyphstrip'), x = c.getContext('2d');
  drawScript(x, c.width, c.height, '#d9b265', '#d9b265');
}

/* ================= animate ================= */
const readout = document.getElementById('readout');
const clock = new THREE.Clock();
const mv = { x:0, y:0 };
let frame = 0, veiled = false;

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), o8('0.1')), t = clock.elapsedTime;

  if (cinema){
    const a = t * o8('0.05');
    camera.position.set(Math.cos(a) * 0o150, 0o60 + Math.sin(t * o8('0.1')) * 0o4, Math.sin(a) * 0o150);
    camera.lookAt(0, 0o16, 0);
  } else {
    let tx = joy.x, ty = joy.y;
    if (keys.has('KeyW') || keys.has('ArrowUp')) ty += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) ty -= 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) tx -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) tx += 1;
    mv.x += (tx - mv.x) * Math.min(1, dt * 0o12);
    mv.y += (ty - mv.y) * Math.min(1, dt * 0o12);
    const spd = (cam.fly ? 0o50 : 0o20) * dt;
    const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
    const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
    if (cam.fly){
      const fy = Math.sin(cam.pitch), fc = Math.cos(cam.pitch);
      cam.pos.x += (fx*fc*mv.y + rx*mv.x) * spd;
      cam.pos.z += (fz*fc*mv.y + rz*mv.x) * spd;
      cam.pos.y += fy * mv.y * spd;
      if (keys.has('Space')) cam.pos.y += spd;
      if (keys.has('ShiftLeft') || keys.has('ShiftRight')) cam.pos.y -= spd;
      cam.pos.y = Math.max(cam.pos.y, groundH(cam.pos.x, cam.pos.z) + o8('1'));
    } else {
      cam.pos.x += (fx*mv.y + rx*mv.x) * spd;
      cam.pos.z += (fz*mv.y + rz*mv.x) * spd;
      cam.pos.x = Math.max(-HALF, Math.min(HALF, cam.pos.x));
      cam.pos.z = Math.max(-HALF, Math.min(HALF, cam.pos.z));
      const ty2 = walkH(cam.pos.x, cam.pos.z) + EYE;
      cam.pos.y += (ty2 - cam.pos.y) * Math.min(1, dt * 0o10);
    }
    camera.position.copy(cam.pos);
    camera.quaternion.setFromEuler(new THREE.Euler(cam.pitch, cam.yaw, 0, 'YXZ'));
  }

  for (let i = 0; i < flameData.length; i++){                  /* fire flicker */
    const L = flameData[i];
    const f = 1 + o8('0.2')*Math.sin(t*0o11 + i*0o7) + o8('0.1')*Math.sin(t*0o23 + i);
    dummy.position.set(L.x, L.y + (f - 1) * o8('0.2'), L.z);
    dummy.rotation.set(0, 0, 0); dummy.scale.set(1, f, 1); dummy.updateMatrix();
    flameData.mesh.setMatrixAt(i, dummy.matrix);
  }
  if (flameData.length) flameData.mesh.instanceMatrix.needsUpdate = true;

  for (const m of mistSprites){
    m.sp.position.x = m.bx + Math.sin(t * m.spd + m.ph) * m.amp;
    m.sp.position.y += Math.sin(t * o8('0.04') + m.ph) * o8('0.002');
  }
  for (const c of canoes){
    if (c.moored){ c.g.position.y = WATER_Y + o8('0.1') + Math.sin(t + c.ph) * o8('0.04');
      c.g.rotation.z = Math.sin(t * o8('0.7') + c.ph) * o8('0.03'); continue; }
    const z = Math.sin(t * c.spd + c.ph) * (HALF - 0o20);
    const x = riverX(z) + c.lane;
    c.g.position.set(x, WATER_Y + o8('0.1') + Math.sin(t * o8('1.2') + c.ph) * o8('0.06'), z);
    const dz = Math.cos(t * c.spd + c.ph);
    c.g.rotation.y = Math.atan2(riverX(z + 1) - riverX(z - 1), 0o2) + (dz < 0 ? Math.PI : 0);
    c.g.rotation.z = Math.sin(t * o8('0.7') + c.ph) * o8('0.04');
  }
  waterMat.opacity = o8('0.66') + Math.sin(t * o8('0.4')) * o8('0.03');

  if ((frame++ % 0o12) === 0 && !cinema)
    readout.textContent = `X ${OCT(cam.pos.x)} · Z ${OCT(cam.pos.z)} · ALT ${OCT(cam.pos.y)}`;

  renderer.render(scene, camera);
  if (!veiled){ veiled = true; document.getElementById('veil').classList.add('gone'); }
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
