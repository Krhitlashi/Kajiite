<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orvaneth · The Stilled Reach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#0b1a14; --deep:#081410; --mist:#e6efe9; --dim:#9db8a4;
    --gold:#d9b36a; --gold-soft:rgba(217,179,106,0.35);
    --panel:rgba(10,24,18,0.78);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; overflow:hidden; overscroll-behavior:none;
    background:var(--deep); color:var(--mist);
    font-family:'Sora',system-ui,sans-serif;
  }
  #scene{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #scene:active{ cursor:grabbing; }
  .vignette{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(120% 92% at 50% 38%, transparent 55%, rgba(4,10,8,0.55) 100%);
  }
  .hud{ position:fixed; z-index:3; user-select:none; -webkit-user-select:none; }
  .panel{
    background:var(--panel);
    border:1px solid var(--gold-soft);
    border-radius:32px 16px 32px 16px;
    box-shadow:0 8px 32px rgba(0,0,0,0.35);
  }

  /* ---------- title ---------- */
  .title{ top:24px; left:24px; padding:16px 24px 16px 16px; display:flex; gap:16px; align-items:stretch; }
  .title .script{ width:40px; flex:none; filter:drop-shadow(0 0 8px rgba(217,179,106,0.25)); }
  .title .script img{ width:100%; height:100%; object-fit:contain; }
  .title h1{
    font-family:'Cinzel',serif; font-weight:700; margin:0;
    font-size:26px; letter-spacing:0.32em; color:var(--mist);
  }
  .title .sub{
    margin-top:6px; font-size:11px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--dim);
  }
  .title .meta{
    margin-top:10px; font-size:11px; letter-spacing:0.12em; color:var(--gold);
    display:flex; gap:12px; align-items:center;
  }
  .title .meta .dot{ color:var(--dim); }

  /* ---------- compass ---------- */
  .compass{
    top:24px; right:24px; width:64px; height:64px; border-radius:50%;
    background:var(--panel); border:1px solid var(--gold-soft);
    display:grid; place-items:center;
  }
  .compass .ring{ position:relative; width:48px; height:48px; }
  .needle{ position:absolute; inset:0; will-change:transform; }
  .needle span{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    font-size:9px; letter-spacing:0.1em; color:var(--gold);
  }
  .needle::before{
    content:''; position:absolute; left:50%; top:14px; transform:translateX(-50%);
    border:4px solid transparent; border-bottom:14px solid var(--gold);
  }
  .needle::after{
    content:''; position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    border:4px solid transparent; border-top:14px solid rgba(157,184,164,0.55);
  }

  /* ---------- info card ---------- */
  .card{
    left:24px; bottom:24px; width:320px; padding:20px 24px;
    display:flex; gap:16px; position:fixed;
    transform:translateY(24px); opacity:0; pointer-events:none;
    transition:transform 0.4s cubic-bezier(0.2,0.9,0.25,1), opacity 0.4s;
  }
  .card.show{ transform:none; opacity:1; pointer-events:auto; }
  .card .glyphs{
    width:48px; flex:none; display:flex; justify-content:center; align-items:center;
    background:rgba(6,16,12,0.6); border:1px solid var(--gold-soft);
    border-radius:16px 8px 16px 8px; padding:8px 0;
  }
  .card .glyphs img{ width:32px; }
  .card h2{ font-family:'Cinzel',serif; margin:0; font-size:20px; letter-spacing:0.08em; }
  .chip{
    display:inline-block; margin-top:8px; padding:4px 12px;
    font-size:10px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase;
    border-radius:8px 16px 8px 16px; color:#081410;
  }
  .stats{ margin-top:12px; font-size:11px; line-height:1.9; letter-spacing:0.06em; color:var(--dim); }
  .stats b{ color:var(--mist); font-weight:600; }
  .flavor{ margin-top:10px; font-size:12px; font-weight:300; color:#c9d8cd; }
  .close{
    position:absolute; top:6px; right:10px; padding:8px;
    background:none; border:none; color:var(--dim); font-size:15px; cursor:pointer;
  }

  /* ---------- dock buttons ---------- */
  .dock{ right:24px; bottom:24px; display:flex; flex-direction:column; gap:8px; }
  .btn{
    width:48px; height:48px; display:grid; place-items:center; cursor:pointer;
    background:var(--panel); border:1px solid var(--gold-soft);
    border-radius:16px 8px 16px 8px; color:var(--gold); font-size:18px;
    transition:transform 0.24s, border-color 0.24s, box-shadow 0.24s;
  }
  .btn:hover{ transform:translateY(-2px); border-color:var(--gold); box-shadow:0 6px 20px rgba(217,179,106,0.18); }
  .btn.on{ background:rgba(217,179,106,0.16); }
  .btn.off{ color:var(--dim); text-decoration:line-through; }

  /* ---------- hint ---------- */
  .hint{
    left:50%; bottom:88px; transform:translateX(-50%);
    padding:8px 24px; font-size:11px; letter-spacing:0.14em; color:var(--dim);
    border-radius:16px 8px 16px 8px; white-space:nowrap; transition:opacity 1.2s;
  }
  .hint.hide{ opacity:0; }

  /* ---------- loading ---------- */
  #load{
    position:fixed; inset:0; z-index:8; background:var(--deep);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px;
    transition:opacity 0.8s;
  }
  #load.done{ opacity:0; pointer-events:none; }
  #load .lscript{ height:176px; clip-path:inset(100% 0 0 0); animation:reveal 2.4s ease forwards; }
  @keyframes reveal{ to{ clip-path:inset(0 0 0 0); } }
  #load .ltitle{
    font-family:'Cinzel',serif; font-size:22px; letter-spacing:0.44em;
    padding-left:0.44em; color:var(--mist);
  }
  .bar{ width:256px; height:2px; background:rgba(217,179,106,0.2); }
  .bar i{ display:block; height:100%; width:0%; background:var(--gold); transition:width 0.3s; }
  .lcap{ font-size:10px; letter-spacing:0.24em; text-transform:uppercase; color:var(--dim); }

  @media (max-width:640px){
    .title{ left:16px; top:16px; padding:12px 16px 12px 12px; gap:12px; }
    .title h1{ font-size:18px; letter-spacing:0.24em; }
    .title .script{ width:28px; }
    .compass{ top:16px; right:16px; width:48px; height:48px; }
    .compass .ring{ width:36px; height:36px; }
    .card{ left:16px; right:80px; bottom:16px; width:auto; }
    .dock{ right:16px; bottom:16px; }
    .hint{ bottom:136px; max-width:calc(100% - 32px); white-space:normal; text-align:center; }
  }
</style>
</head>
<body>

<canvas id="scene" aria-label="Orvaneth, a 3D city in a misty birch forest"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="title hud panel">
  <div class="script" aria-hidden="true"><img id="titleScript" alt=""></div>
  <div>
    <h1>ORVANETH</h1>
    <div class="sub">The Stilled Reach · Birchmist Vale</div>
    <div class="meta">
      <span id="dateEl">⟡</span>
      <span class="dot">·</span>
      <span id="clockEl">--₈</span>
    </div>
  </div>
</header>

<div class="compass hud" aria-hidden="true">
  <div class="ring"><div class="needle" id="needle"><span>N</span></div></div>
</div>

<aside class="card panel hud" id="card">
  <button class="close" id="cardClose" aria-label="Close">✕</button>
  <div class="glyphs"><img id="cardScript" alt=""></div>
  <div>
    <h2 id="cardName"></h2>
    <span class="chip" id="cardChip"></span>
    <div class="stats" id="cardStats"></div>
    <div class="flavor" id="cardFlavor"></div>
  </div>
</aside>

<nav class="dock hud">
  <button class="btn" id="btnMode" aria-label="Toggle dusk">☽</button>
  <button class="btn off" id="btnSound" aria-label="Toggle ambient sound">♬</button>
  <button class="btn on" id="btnOrbit" aria-label="Toggle slow orbit">⟳</button>
</nav>

<div class="hint panel hud" id="hint">Drag to orbit · Pinch or scroll to near · Tap a spire to learn it</div>

<div id="load">
  <img class="lscript" id="loadScript" alt="">
  <div class="ltitle">ORVANETH</div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="lcap" id="loadCap">Waking the vale</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   utilities · all round numbers favor eights, fractions /64
============================================================ */
const lerp = (a,b,t)=>a+(b-a)*t;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const smoothstep = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const easeInOut = t=>t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const v3 = (x,y,z)=>new THREE.Vector3(x,y,z);
const nextFrame = ()=>new Promise(r=>requestAnimationFrame(r));
const hashStr = s=>{ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; };
const mulberry = seed=>{ let a=seed>>>0; return ()=>{ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; };
const oct = v=>(v<0?'−':'')+Math.abs(Math.round(v)).toString(8)+'₈';
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarsePointer = matchMedia('(pointer: coarse)').matches;

/* ---------- the Reach calendar ( epoch 2010-09-06 = 1.1.1 ) ---------- */
function reachDate(d=new Date()){
  const epoch = Date.UTC(2010,8,6);
  const today = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  let n = Math.floor((today-epoch)/86400000);
  let y = 1;
  for(;;){ const len = (y%4===0)?366:365; if(n<len) break; n-=len; y++; }
  let m = 1;
  for(;;){ const len = (m<=12)?28:((y%4===0)?30:29); if(n<len) break; n-=len; m++; }
  return y+'.'+m+'.'+(n+1);
}
document.getElementById('dateEl').textContent = '⟡ '+reachDate();
setInterval(()=>{
  const d=new Date();
  document.getElementById('clockEl').textContent =
    d.getHours().toString(8).padStart(2,'0')+'₈·'+d.getMinutes().toString(8).padStart(2,'0')+'₈';
},1000);

/* ============================================================
   the vertical script · strokes flow bottom to top, never cross
============================================================ */
const TEMPLATES = [
  [ [[.30,.06],[.30,.94]], [[.30,.38],[.52,.40],[.62,.62]], [[.30,.62],[.48,.64],[.56,.84]] ],
  [ [[.28,.06],[.30,.70],[.44,.90],[.66,.92]], [[.30,.34],[.55,.36],[.64,.52]] ],
  [ [[.34,.06],[.22,.30],[.46,.55],[.34,.80],[.40,.94]], [[.40,.62],[.60,.66],[.66,.84]] ],
  [ [[.24,.16],[.24,.74]], [[.56,.16],[.56,.74]], [[.24,.16],[.40,.06],[.56,.16]] ],
  [ [[.22,.30],[.30,.10],[.50,.10],[.58,.30]], [[.40,.34],[.40,.92]], [[.40,.58],[.58,.62],[.66,.80]] ],
  [ [[.62,.06],[.62,.94]], [[.62,.40],[.40,.42],[.30,.62]], [[.62,.66],[.46,.68],[.38,.86]] ],
  [ [[.20,.90],[.40,.96],[.60,.90]], [[.60,.88],[.62,.50],[.56,.10]] ],
  [ [[.26,.20],[.50,.24],[.44,.50],[.64,.56]], [[.26,.20],[.24,.62],[.36,.86]] ],
];
function roundRect4(ctx,x,y,w,h,r){
  const [tl,tr,br,bl]=r;
  ctx.beginPath();
  ctx.moveTo(x+tl,y); ctx.lineTo(x+w-tr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+tr);
  ctx.lineTo(x+w,y+h-br); ctx.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
  ctx.lineTo(x+bl,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-bl);
  ctx.lineTo(x,y+tl); ctx.quadraticCurveTo(x,y,x+tl,y); ctx.closePath();
}
function drawStroke(ctx,p){
  ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]);
  if(p.length===2){ ctx.lineTo(p[1][0],p[1][1]); }
  else{
    for(let i=1;i<p.length-1;i++){
      const mx=(p[i][0]+p[i+1][0])/2, my=(p[i][1]+p[i+1][1])/2;
      ctx.quadraticCurveTo(p[i][0],p[i][1],mx,my);
    }
    ctx.lineTo(p[p.length-1][0],p[p.length-1][1]);
  }
  ctx.stroke();
}
function stackGlyphs(ctx,cx,yBottom,cw,ch,n,seed){
  const gap = ch*0.22;
  for(let k=0;k<n;k++){
    const gy = yBottom - k*(ch+gap) - ch;
    const idx = (seed + Math.imul(k+1,2654435761))>>>0;
    const t = TEMPLATES[idx % TEMPLATES.length];
    const mirror = ((idx>>>3)&1)===1;
    for(const stroke of t){
      drawStroke(ctx, stroke.map(([ux,uy])=>[ cx-cw/2+(mirror?1-ux:ux)*cw, gy+(1-uy)*ch ]));
    }
    if((idx&7)===0){
      ctx.beginPath();
      ctx.arc(cx-cw/2+(mirror?0.18:0.82)*cw, gy+0.12*ch, cw*0.06, 0, Math.PI*2);
      ctx.fill();
    }
  }
}
function scriptCanvas(name, opts={}){
  const o = Object.assign({ w:64, h:208, ink:'#d9b36a', bg:null, cols:1, cellW:40, cellH:30, pad:14 }, opts);
  const cv = document.createElement('canvas'); cv.width=o.w; cv.height=o.h;
  const ctx = cv.getContext('2d');
  if(o.bg){
    roundRect4(ctx,3,3,o.w-6,o.h-6,[16,8,16,8]);
    ctx.fillStyle=o.bg; ctx.fill();
    ctx.strokeStyle=o.ink; ctx.globalAlpha=0.5; ctx.lineWidth=2; ctx.stroke(); ctx.globalAlpha=1;
  }
  const n = 4 + (hashStr(name)%3);
  const seed = hashStr(name);
  ctx.strokeStyle=o.ink; ctx.fillStyle=o.ink;
  ctx.lineWidth=Math.max(2.4, o.cellW*0.075);
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(o.cols===2){
    const nR=Math.floor(n/2), nL=n-nR;
    stackGlyphs(ctx, o.w*0.68, o.h*0.52, o.cellW*0.8, o.cellH*0.88, nR, seed);
    stackGlyphs(ctx, o.w*0.30, o.h-o.pad, o.cellW*0.8, o.cellH*0.94, nL, Math.imul(seed,7)+3);
  }else{
    stackGlyphs(ctx, o.w/2, o.h-o.pad, o.cellW, o.cellH, n, seed);
  }
  return cv;
}
function scriptTexture(name, opts){
  const tex = new THREE.CanvasTexture(scriptCanvas(name,opts));
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return tex;
}
const scriptDataURL = (name,opts)=>scriptCanvas(name,opts).toDataURL();

document.getElementById('titleScript').src = scriptDataURL('Orvaneth',{w:56,h:190,cellW:36,cellH:26});
document.getElementById('loadScript').src  = scriptDataURL('Orvaneth the still',{w:56,h:176,cellW:36,cellH:24});

/* ============================================================
   renderer · scene · sky · light
============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xcfdcd6, 0.0105);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.5, 700);
camera.position.set(150, 92, 168);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
pmrem.dispose();

const skyU = {
  uTop:{value:new THREE.Color(0x7fa8c0)}, uMid:{value:new THREE.Color(0xb9d0d6)},
  uBot:{value:new THREE.Color(0xe3ebe4)}, uSunCol:{value:new THREE.Color(0xfff2d8)},
  uSunDir:{value:v3(0.5,0.8,0.3)}, uHaze:{value:0.5},
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(380,24,16),
  new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false, uniforms:skyU,
    vertexShader:'varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:`
      uniform vec3 uTop,uMid,uBot,uSunCol,uSunDir; uniform float uHaze; varying vec3 vDir;
      void main(){
        vec3 d=normalize(vDir);
        float h=clamp(d.y,-0.2,1.0);
        vec3 col=mix(uBot,uMid,smoothstep(-0.02,0.24,h));
        col=mix(col,uTop,smoothstep(0.18,0.72,h));
        col+=uSunCol*pow(max(dot(d,normalize(uSunDir)),0.0),28.0)*uHaze;
        gl_FragColor=vec4(col,1.0);
      }`
  })
);
sky.frustumCulled=false; scene.add(sky);

const hemi = new THREE.HemisphereLight(0xcfe3e8, 0x44584a, 0.8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dd, 1.15);
sun.position.set(72,112,40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-104; sun.shadow.camera.right=104;
sun.shadow.camera.top=104; sun.shadow.camera.bottom=-104;
sun.shadow.camera.near=16; sun.shadow.camera.far=320;
sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.5;
scene.add(sun); scene.add(sun.target);

/* ============================================================
   terrain · river · plaza · pool
============================================================ */
const noiseBase = (x,z)=>
  3.1*Math.sin(x*0.041+1.3)*Math.cos(z*0.047-0.7)
+ 1.7*Math.sin(x*0.093-2.1)*Math.sin(z*0.081+1.4)
+ 0.8*Math.sin((x+z)*0.062+0.5);
const riverZ = x=>0.36*x + 18*Math.sin(x*0.05) - 34;
const waterY = x=>noiseBase(x, riverZ(x)) - 3.55;

const TYPES = {
  house:  { label:'Dwelling',     wall:0x1e4a38, frame:0xd9b36a, chip:'#7fae8f', flavor:'Quiet rooms stacked toward the mist.' },
  eatery: { label:'Common Table', wall:0x54402e, frame:0xd6c69c, chip:'#c9a86f', flavor:'Long hearths, shared bowls, steam and story.' },
  station:{ label:'Wayhouse',     wall:0xdfe3e2, frame:0x8f9a9c, chip:'#c2cdcf', flavor:'Canoes rest while routes braid through the vale.' },
  tower:  { label:'High Facility',wall:0x235043, frame:0xd9b36a, chip:'#8fb8a2', flavor:'The city’s work climbs here to think.' },
  sanctum:{ label:'Sanctum',      wall:0x164136, frame:0xe2c07c, chip:'#e2c07c', flavor:'A diamond anchored in still water.' },
};
const SYL_A=['or','vel','keth','tha','mir','sul','an','dr','il','fen','br','lyr'];
const SYL_B=['ath','ora','une','is','ara','eth','yn','ova','ei','al'];
function genName(i){
  const r = mulberry(8000+i*89);
  const cap = s=>s[0].toUpperCase()+s.slice(1);
  let n = cap(SYL_A[(r()*SYL_A.length)|0]+SYL_B[(r()*SYL_B.length)|0]);
  if(r()<0.3) n += ' '+cap(SYL_A[(r()*SYL_A.length)|0]+SYL_B[(r()*SYL_B.length)|0]);
  return n;
}

const SPECS = [
  {x:0,   z:0,   type:'sanctum', tiers:7, w:10,  d:10,  tierH:3.0, under:2, tierHu:2.6, rot:0, fixed:'Anorath'},
  {x:-30, z:14,  type:'tower',   tiers:8, w:8.5, d:8.5, tierH:3.0, rot:0.2},
  {x:-22, z:-20, type:'eatery',  tiers:4, w:9,   d:7,   tierH:3.2, rot:-0.3},
  {x:24,  z:-18, type:'house',   tiers:4, w:7,   d:6,   tierH:3.2, rot:0.5},
  {x:30,  z:12,  type:'house',   tiers:3, w:6.5, d:6,   tierH:3.2, rot:-0.4},
  {x:10,  z:30,  type:'house',   tiers:4, w:7,   d:6.5, tierH:3.2, rot:0.1},
  {x:-12, z:32,  type:'station', tiers:3, w:11,  d:8,   tierH:3.4, rot:0.15},
  {x:38,  z:28,  type:'tower',   tiers:9, w:8,   d:8,   tierH:3.0, rot:-0.2},
  {x:-38, z:-8,  type:'house',   tiers:3, w:6,   d:6,   tierH:3.2, rot:0.7},

function heightRaw(x,z){
  let h = noiseBase(x,z);
  const d = z - riverZ(x);
  h -= 7.6*Math.exp(-(d*d)/144.5);
  const r = Math.hypot(x,z);
  h = lerp(h, 0.15, smoothstep(26,15,r));
  h = lerp(h, -6.2, smoothstep(14.6,11.0,r));
  return h;
}
SPECS.forEach(s=>{ s.h0 = heightRaw(s.x, s.z); });
function heightAt(x,z){
  let h = heightRaw(x,z);
  for(const b of SPECS){
    const rr = Math.hypot(x-b.x, z-b.z);
    if(rr < b.flatR){ const t=1-rr/b.flatR; h = lerp(h, b.h0, t*t*0.88); }
  }
  return h;
}

function buildGround(){
  const g = new THREE.PlaneGeometry(440,440,160,160);
  g.rotateX(-Math.PI/2);
  const pos = g.attributes.position;
  const colors = new Float32Array(pos.count*3);
  const c = new THREE.Color(), a=new THREE.Color(0x4a5c4e), b2=new THREE.Color(0x5d705c),
        bed=new THREE.Color(0x35464a), deep=new THREE.Color(0x26363a);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    const h=heightAt(x,z); pos.setY(i,h);
    const r=Math.hypot(x,z);
    const t=0.5+0.5*Math.sin(x*0.13+z*0.17+2.0);
    c.copy(a).lerp(b2,t);
    if(h<-2) c.lerp(bed, smoothstep(-2,-5,h));
    if(h<-5) c.lerp(deep, smoothstep(-5,-6.2,h));
    if(r<21.6) c.lerp(new THREE.Color(0xa9b0ab), smoothstep(21.6,19.5,r));
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors,3));

============================================================ */
function ribbonGeometry(points, halfW, yLift){
  const N=points.length;
  const posArr=new Float32Array(N*2*3), uvArr=new Float32Array(N*2*2), idx=[];
  const up=v3(0,1,0);
  for(let i=0;i<N;i++){
    const p=points[i];
    const pn=points[Math.min(i+1,N-1)], pp=points[Math.max(i-1,0)];
    const tan=v3(pn.x-pp.x,0,pn.z-pp.z).normalize();
    const side=v3(0,0,0).crossVectors(up,tan).normalize();
    const y=p.y+yLift;
    posArr.set([p.x-side.x*halfW, y, p.z-side.z*halfW, p.x+side.x*halfW, y, p.z+side.z*halfW], i*6);
    uvArr.set([0, i/(N-1), 1, i/(N-1)], i*4);
    if(i<N-1){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(posArr,3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvArr,2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const dioriteMat = new THREE.MeshStandardMaterial({ color:0xc8cdca, roughness:0.18, metalness:0.02, envMapIntensity:0.9 });
const andesiteMat = new THREE.MeshStandardMaterial({ color:0x5f6662, roughness:0.8 });

  { pts:[[30,4],[38,-2],[44,-4]], w:1.8 },
  { pts:[[16,14],[30,20],[44,26],[54,40]], w:1.8 },
  { pts:[[-16,14],[-28,20],[-38,24]], w:1.8 },
];

function buildPaths(){
  const borderGeos=[], topGeos=[];

    const curve = new THREE.CatmullRomCurve3(def.pts.map(p=>v3(p[0], heightAt(p[0],p[1]), p[1])), false, 'catmullrom', 0.5);
    const pts = curve.getSpacedPoints(128);
    topGeos.push(ribbonGeometry(pts, def.w, 0.18));
    borderGeos.push(ribbonGeometry(pts, def.w+0.9, 0.06));
    for(let i=0;i<pts.length;i+=4) pathSamples.push(pts[i]);
  }
  /* the bridge across the pool */
  const bp=[v3(0,0.34,15.4), v3(0,0.34,11), v3(0,0.34,6.4)];

const entranceMat = new THREE.MeshStandardMaterial({

});
function roundedTrap(bw,tw,h,rb,rt){
  const s=new THREE.Shape();
  const sl=(bw/2-tw/2)/h;
  s.moveTo(-bw/2+rb,0);
  s.lineTo(bw/2-rb,0);
  s.quadraticCurveTo(bw/2,0, bw/2-sl*rt, rt);
  s.lineTo(tw/2+sl*rt, h-rt);
  s.quadraticCurveTo(tw/2,h, tw/2-rt, h);
  s.lineTo(-tw/2+rt, h);
  s.quadraticCurveTo(-tw/2,h, -tw/2-sl*rt, h-rt);
  s.lineTo(-bw/2+sl*rb, rb);
  s.quadraticCurveTo(-bw/2,0, -bw/2+rb, 0);
  return s;
}
function frameTube(cx,cz,yb,yt,sx,sz,upward){
  const out=0.52, over=0.56;
  const curve = upward
    ? new THREE.QuadraticBezierCurve3(v3(cx,yb-0.12,cz), v3(cx,yt-0.4,cz), v3(cx+sx*out,yt+over,cz+sz*out))
    : new THREE.QuadraticBezierCurve3(v3(cx,yt+0.12,cz), v3(cx,yb+0.4,cz), v3(cx+sx*out,yb-over,cz+sz*out));
  return new THREE.TubeGeometry(curve, 10, 0.13, 6, false);
}
const selectMeshes=[];
function buildZiggurat(s){
  const tiers=s.tiers, tierH=s.tierH, w=s.w, d=s.d;
  const under=s.under||0, tierHu=s.tierHu||tierH;
  const topW=Math.max(2.2,w*0.30), topD=Math.max(2.0,d*0.30);
  const insW=(w/2-topW/2)/Math.max(1,tiers-1), insD=(d/2-topD/2)/Math.max(1,tiers-1);
  const wallGeos=[], frameGeos=[];
  for(let i=0;i<tiers;i++){
    const hw=w/2-i*insW, hd=d/2-i*insD, y=i*tierH;
    wallGeos.push(new THREE.BoxGeometry(hw*2,tierH,hd*2).translate(0,y+tierH/2,0));
    for(const sx of [-1,1]) for(const sz of [-1,1])
      frameGeos.push(frameTube(sx*hw, sz*hd, y, y+tierH, sx, sz, true));
  }
  for(let j=1;j<=under;j++){
    const hw=Math.max(topW*0.42, w/2-j*insW), hd=Math.max(topD*0.42, d/2-j*insD);
    const yTop=-(j-1)*tierHu, yBot=-j*tierHu;
    wallGeos.push(new THREE.BoxGeometry(hw*2,tierHu,hd*2).translate(0,(yTop+yBot)/2,0));
    for(const sx of [-1,1]) for(const sz of [-1,1])
      frameGeos.push(frameTube(sx*hw, sz*hd, yBot, yTop, sx, sz, false));
  }
  const T=TYPES[s.type];
  const wallMat=new THREE.MeshStandardMaterial({
    color:T.wall, roughness:s.type==='station'?0.35:0.5, metalness:0.06, envMapIntensity:0.5,
  });
  const frameMat=new THREE.MeshStandardMaterial({
    color:T.frame, metalness:0.85, roughness:0.34,
    emissive:0x33260c, emissiveIntensity:0.35, envMapIntensity:1.25,
  });
  const group=new THREE.Group();
  const walls=new THREE.Mesh(BGU.mergeGeometries(wallGeos), wallMat);
  walls.castShadow=walls.receiveShadow=true;
  walls.userData.spec=s; s.frameMat=frameMat;
  selectMeshes.push(walls);
  group.add(walls);
  group.add(new THREE.Mesh(BGU.mergeGeometries(frameGeos), frameMat));

  /* rounded trapezoidal entrance */
  const bw=Math.min(2.8,w*0.44), tw=bw*0.58, eh=Math.min(tierH*0.72,2.7);
  const shape=roundedTrap(bw,tw,eh,bw*0.22,tw*0.3);
  const ent=new THREE.Mesh(
    new THREE.ExtrudeGeometry(shape,{depth:0.5,bevelEnabled:true,bevelSize:0.08,bevelThickness:0.08,bevelSegments:2,curveSegments:10}),
    entranceMat
  );
  ent.position.set(0,0.14,d/2-0.02);
  group.add(ent);
  const trimPts=shape.getPoints(20).map(p=>v3(p.x,p.y+0.14,d/2+0.56));
  const trim=new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(trimPts,true,'catmullrom',0.6), 48, 0.055, 6, true),
    frameMat
  );
  group.add(trim);

  /* finial on the sanctum */
  if(s.type==='sanctum'){
    const fin=new THREE.Mesh(new THREE.ConeGeometry(topW*0.55,1.6,4).rotateY(Math.PI/4), frameMat);
    fin.position.y=tiers*tierH+0.8; fin.castShadow=true; group.add(fin);
  }

  /* signage in the vertical script */
  const wide = (s.type==='station'||s.type==='sanctum');
  if(wide){
    const tex=scriptTexture(s.name,{w:200,h:256,cols:2,bg:'#0d211a',cellW:44,cellH:38,pad:22});
    const sign=new THREE.Mesh(
      new THREE.PlaneGeometry(2.8,2.1),
      new THREE.MeshBasicMaterial({map:tex,transparent:true,toneMapped:false})
    );
    sign.position.set(0, tierH*0.62, d/2+0.07);
    group.add(sign);
  }else{
    const tex=scriptTexture(s.name,{w:96,h:300,bg:'#0d211a',cellW:44,cellH:40,pad:26});
    const stele=new THREE.Mesh(new THREE.BoxGeometry(0.62,2.5,0.16),
      new THREE.MeshStandardMaterial({color:0x0d1f18,roughness:0.6}));
    stele.position.set(w*0.34,1.25,d/2+1.05); stele.castShadow=true;
    const face=new THREE.Mesh(new THREE.PlaneGeometry(0.5,2.2),
      new THREE.MeshBasicMaterial({map:tex,transparent:true,toneMapped:false}));
    face.position.set(w*0.34,1.25,d/2+1.14);
    group.add(stele,face);
  }

  group.position.set(s.x, s.h0, s.z);
  group.rotation.y = s.rot;
  scene.add(group);
}
function buildCity(){
  for(const s of SPECS){
    if(s.rot===undefined||s.type==='sanctum'){}
    if(!s.fixed && s.type!=='station'){
      const dx=-s.x, dz=-s.z, len=Math.hypot(dx,dz)||1;
      s.rot = Math.atan2(dx/len, dz/len) + (mulberry(hashStr(s.name))()-0.5)*0.5;
    }
    buildZiggurat(s);
  }
}

============================================================ */
const lampFlames=[]; let flameOuter, flameInner, glowMat; const lampLights=[];
function buildLamps(){
  const pillarGeos=[];
  const spots=[];
  const add=(x,z)=>spots.push(v3(x, heightAt(x,z), z));
  for(const a of [0.4,2.0,3.6,5.2]) add(Math.sin(a)*16.5, Math.cos(a)*16.5);
  const walkPath=(def,step,side)=>{
    const curve=new THREE.CatmullRomCurve3(def.pts.map(p=>v3(p[0],heightAt(p[0],p[1]),p[1])),false,'catmullrom',0.5);
    const pts=curve.getSpacedPoints(128);
    for(let i=step;i<pts.length-8;i+=step*2){
      const p=pts[i], pn=pts[i+1];
      const tan=v3(pn.x-p.x,0,pn.z-p.z).normalize();
      const sd=v3(0,0,0).crossVectors(v3(0,1,0),tan).normalize().multiplyScalar(side*(def.w+1.6));
      add(p.x+sd.x, p.z+sd.z);
    }
  };
  walkPath(PATH_DEFS[0],20,1); walkPath(PATH_DEFS[1],22,-1); add(41.5,-7.4);

  for(const p of spots){
    const g=new THREE.CylinderGeometry(0.16,0.34,3.4,4,1).rotateY(Math.PI/4);
    g.translate(p.x,p.y+1.7,p.z);
    pillarGeos.push(g);
    const bowl=new THREE.CylinderGeometry(0.30,0.20,0.24,4,1).rotateY(Math.PI/4);
    bowl.translate(p.x,p.y+3.5,p.z);
    pillarGeos.push(bowl);
    lampFlames.push(v3(p.x,p.y+3.85,p.z));
  }
  const pillars=new THREE.Mesh(BGU.mergeGeometries(pillarGeos), dioriteMat);
  pillars.castShadow=true; scene.add(pillars);

  const cone=new THREE.ConeGeometry(0.17,0.55,7);
  flameOuter=new THREE.InstancedMesh(cone, new THREE.MeshBasicMaterial({color:0xffa64d,toneMapped:false}), lampFlames.length);
  flameInner=new THREE.InstancedMesh(new THREE.ConeGeometry(0.09,0.34,7), new THREE.MeshBasicMaterial({color:0xffe9b8,toneMapped:false}), lampFlames.length);
  scene.add(flameOuter, flameInner);

  const gPos=new Float32Array(lampFlames.length*3), gSeed=new Float32Array(lampFlames.length), gSize=new Float32Array(lampFlames.length);
  lampFlames.forEach((p,i)=>{ gPos.set([p.x,p.y+0.2,p.z],i*3); gSeed[i]=Math.random()*100; gSize[i]=20+Math.random()*10; });
  const gg=new THREE.BufferGeometry();
  gg.setAttribute('position',new THREE.BufferAttribute(gPos,3));
  gg.setAttribute('aSeed',new THREE.BufferAttribute(gSeed,1));
  gg.setAttribute('aSize',new THREE.BufferAttribute(gSize,1));
  glowMat=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uTime:{value:0}, uOp:{value:0.4}, uCol:{value:new THREE.Color(0xffb35c)}, uPR:{value:1} },
    vertexShader:`attribute float aSeed; attribute float aSize; uniform float uTime,uPR; varying float vA;
      void main(){ vA=0.75+0.25*sin(uTime*9.0+aSeed*7.0);
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=aSize*uPR*(160.0/-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform vec3 uCol; uniform float uOp; varying float vA;
      void main(){ float d=length(gl_PointCoord-vec2(0.5));
        gl_FragColor=vec4(uCol, smoothstep(0.5,0.0,d)*uOp*vA); }`,
  });
  const glow=new THREE.Points(gg,glowMat); glow.frustumCulled=false; scene.add(glow);

  const plazaLamps=lampFlames.slice().sort((a,b)=>(a.x*a.x+a.z*a.z)-(b.x*b.x+b.z*b.z)).slice(0,4);
  for(const p of plazaLamps){
    const L=new THREE.PointLight(0xff9a3d, 0.4, 26, 2);
    L.position.copy(p).add(v3(0,0.3,0));
    scene.add(L); lampLights.push(L);
  }
}

function fernTexture(){
  const cv=document.createElement('canvas'); cv.width=128; cv.height=256;
  const ctx=cv.getContext('2d');
  ctx.strokeStyle='#5d7a52'; ctx.lineCap='round';
  ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(64,252); ctx.quadraticCurveTo(60,140,70,26); ctx.stroke();
  ctx.lineWidth=3;
  for(let i=0;i<15;i++){
    const y=240-i*14, len=44-i*2.4;
    for(const s of [-1,1]){
      ctx.strokeStyle='rgba('+(80+i*3)+','+(110+i*4)+','+(70+i*2)+',0.95)';
      ctx.beginPath(); ctx.moveTo(64+(s>0?2:-2),y);
      ctx.quadraticCurveTo(64+s*len*0.7, y-6, 64+s*len, y-16);
      ctx.stroke();
    }
  }
  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}
const treePosns=[];
function buildForest(){
  const r=mulberry(88448);
  const placed=[];
  const okSpot=(x,z,minPath,minB)=>{
    if(Math.hypot(x,z)<16) return false;
    if(Math.abs(z-riverZ(x))<7) return false;
    for(let i=0;i<pathSamples.length;i+=2){
      const p=pathSamples[i];
      if(Math.hypot(x-p.x,z-p.z)<minPath) return false;
    }
    for(const b of SPECS){ if(Math.hypot(x-b.x,z-b.z)<b.w+minB) return false; }
    return true;
  };
  let tries=0;
  while(placed.length<152 && tries++<900){
    const ang=r()*Math.PI*2, rad=24+128*Math.sqrt(r());
    const x=Math.sin(ang)*rad, z=Math.cos(ang)*rad;
    if(Math.abs(x)>150||Math.abs(z)>150) continue;
    if(!okSpot(x,z,4.5,3)) continue;
    placed.push({x,z,h:heightAt(x,z),s:0.8+r()*0.7});
  }
  treePosns.push(...placed);

  const trunkGeo=new THREE.CylinderGeometry(0.22,0.38,1,7,1);
  const trunkMat=new THREE.MeshStandardMaterial({map:barkTexture(),roughness:0.7});
  const trunks=new THREE.InstancedMesh(trunkGeo,trunkMat,placed.length);
  const canGeo=new THREE.SphereGeometry(1,7,5);
  const canMat=new THREE.MeshStandardMaterial({roughness:0.9});
  const canopy=new THREE.InstancedMesh(canGeo,canMat,placed.length*2);
  const M=new THREE.Matrix4(), Q=new THREE.Quaternion(), E=new THREE.Euler(), C=new THREE.Color();
  const palette=[0x6f8f5f,0x7fa06a,0x8fae78,0xa3b183,0x7c9a6e];
  placed.forEach((t,i)=>{
    const h=6.5+t.s*4.5;
    E.set(0,r()*Math.PI*2,0); Q.setFromEuler(E);
    M.compose(v3(t.x,t.y+h/2,t.z),Q,v3(1,h,1)); trunks.setMatrixAt(i,M);
    const cr=2.2*t.s+0.8;
    M.compose(v3(t.x,t.y+h-0.5,t.z),Q,v3(cr,cr*0.72,cr)); canopy.setMatrixAt(i*2,M);
    canopy.setColorAt(i*2, C.setHex(palette[(r()*palette.length)|0]));
    M.compose(v3(t.x+cr*0.3,t.y+h+0.8,t.z+cr*0.2),Q,v3(cr*0.6,cr*0.5,cr*0.6)); canopy.setMatrixAt(i*2+1,M);
    canopy.setColorAt(i*2+1, C.setHex(palette[(r()*palette.length)|0]));
  });
  trunks.instanceMatrix.needsUpdate=true; canopy.instanceMatrix.needsUpdate=true;
  if(canopy.instanceColor) canopy.instanceColor.needsUpdate=true;
  trunks.castShadow=canopy.castShadow=true;
  scene.add(trunks,canopy);

  /* ferns */
  const fa=new THREE.PlaneGeometry(1.7,1.7).translate(0,0.85,0);
  const fb=fa.clone().applyMatrix4(new THREE.Matrix4().makeRotationY(Math.PI/2));
  const fernGeo=BGU.mergeGeometries([fa,fb]);
  const fernMat=new THREE.MeshStandardMaterial({map:fernTexture(),alphaTest:0.4,side:THREE.DoubleSide,roughness:1});
  const fernCount=168;
  const ferns=new THREE.InstancedMesh(fernGeo,fernMat,fernCount);
  let fi=0;
  while(fi<fernCount){
    let x,z;
    if(r()<0.6 && placed.length){ const t=placed[(r()*placed.length)|0]; const a=r()*Math.PI*2, rr=1+r()*3; x=t.x+Math.sin(a)*rr; z=t.z+Math.cos(a)*rr; }
    else{ const p=pathSamples[(r()*pathSamples.length)|0]; const a=r()*Math.PI*2, rr=2+r()*3; x=p.x+Math.sin(a)*rr; z=p.z+Math.cos(a)*rr; }
    if(Math.abs(z-riverZ(x))<6 || Math.hypot(x,z)<14) continue;
    const sc=0.7+r()*0.8;
    E.set(0,r()*Math.PI*2,0); Q.setFromEuler(E);
    M.compose(v3(x,heightAt(x,z),z),Q,v3(sc,sc,sc));
    ferns.setMatrixAt(fi++,M);
  }
  ferns.instanceMatrix.needsUpdate=true; scene.add(ferns);

  /* rocks + lichen */
  const rockGeo=new THREE.IcosahedronGeometry(1,0);
  const rocks=new THREE.InstancedMesh(rockGeo,new THREE.MeshStandardMaterial({roughness:0.95}),48);
  const rockTops=[];
  for(let i=0;i<48;i++){
    let x,z;
    if(i<16){ x=lerp(-90,110,r()); z=riverZ(x)+(r()<0.5?-1:1)*(9+r()*4); }
    else{ const a=r()*Math.PI*2, rr=18+r()*110; x=Math.sin(a)*rr; z=Math.cos(a)*rr; }
    const sy=0.5+r()*0.5;
    E.set(r()*0.4,r()*Math.PI*2,r()*0.4); Q.setFromEuler(E);
    const sc=v3(1.1+r()*0.9, sy, 0.9+r()*0.8);
    M.compose(v3(x,heightAt(x,z)+0.1,z),Q,sc);
    rocks.setMatrixAt(i,M);
    rocks.setColorAt(i, C.setHex(0x6f7a72).offsetHSL(0,0,(r()-0.5)*0.06));
    rockTops.push(v3(x,heightAt(x,z)+sy*0.72,z));
  }
  rocks.instanceMatrix.needsUpdate=true;
  if(rocks.instanceColor) rocks.instanceColor.needsUpdate=true;
  rocks.castShadow=true; scene.add(rocks);

  const lich=new THREE.InstancedMesh(
    new THREE.CircleGeometry(0.42,7).rotateX(-Math.PI/2),
    new THREE.MeshStandardMaterial({roughness:1}), 96
  );
  for(let i=0;i<96;i++){
    let p;
    if(i<48 && rockTops.length) p=rockTops[i%rockTops.length].clone().add(v3((r()-0.5)*0.8,0.05,(r()-0.5)*0.8));
    else{ const a=r()*Math.PI*2, rr=15+r()*100; p=v3(Math.sin(a)*rr, heightAt(Math.sin(a)*rr,Math.cos(a)*rr)+0.04, Math.cos(a)*rr); }
    E.set(0,r()*Math.PI*2,0); Q.setFromEuler(E);
    const sc=0.6+r()*1.1;
    M.compose(p,Q,v3(sc,1,sc));
    lich.setMatrixAt(i,M);
    lich.setColorAt(i, C.setHex(0xb6c4a0).offsetHSL(0,0,(r()-0.5)*0.08));
  }
  lich.instanceMatrix.needsUpdate=true;
  if(lich.instanceColor) lich.instanceColor.needsUpdate=true;
  scene.add(lich);
}

const canoes=[];
function makeCanoe(){
  const g=new THREE.Group();
  const s=new THREE.Shape();
  s.moveTo(2.3,0);
  s.quadraticCurveTo(1.1,0.55,0,0.55);
  s.quadraticCurveTo(-1.2,0.55,-2.3,0);
  s.quadraticCurveTo(-1.2,-0.55,0,-0.55);
  s.quadraticCurveTo(1.1,-0.55,2.3,0);
  const hull=new THREE.Mesh(
    new THREE.ExtrudeGeometry(s,{depth:0.5,bevelEnabled:true,bevelThickness:0.14,bevelSize:0.14,bevelSegments:3,curveSegments:12}).rotateX(-Math.PI/2).translate(0,-0.3,0),
    new THREE.MeshStandardMaterial({color:0x1c4636,roughness:0.45,envMapIntensity:0.6})
  );
  hull.castShadow=true;
  const rimPts=s.getPoints(24).map(p=>v3(p.x*0.96,0.06,-p.y*0.96));
  const rim=new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rimPts,true,'catmullrom',0.5),48,0.045,6,true),
    new THREE.MeshStandardMaterial({color:0xd9b36a,metalness:0.85,roughness:0.35})
  );
  const seat=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.12,0.8),
    new THREE.MeshStandardMaterial({color:0xcbb98e,roughness:0.7}));
  seat.position.y=-0.08;
  g.add(hull,rim,seat);
  return g;
}
let riverSpline;
function buildCanoes(){
  const pts=[];
  for(let x=-112;x<=120;x+=24) pts.push(v3(x, waterY(x), riverZ(x)));
  riverSpline=new THREE.CatmullRomCurve3(pts,false,'catmullrom',0.5);
  const speeds=[0.010,0.007,0.013], offs=[0.1,0.45,0.75], sides=[-2.2,2.0,-1.6];
  for(let i=0;i<3;i++){
    const c=makeCanoe(); scene.add(c);
    canoes.push({g:c,t:offs[i],sp:speeds[i],side:sides[i],ph:i*2.1});
  }
  const moor=makeCanoe(); moor.position.set(47.5, waterY(47.5)+0.3, -3.4); moor.rotation.y=1.2;
  scene.add(moor); canoes.push({g:moor,moored:true,ph:4.4});
}

function softDotTexture(){
  const cv=document.createElement('canvas'); cv.width=cv.height=256;
  const ctx=cv.getContext('2d');
  const gr=ctx.createRadialGradient(128,128,8,128,128,128);
  gr.addColorStop(0,'rgba(255,255,255,0.85)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gr; ctx.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(cv);
}
const softTex=softDotTexture();
const mists=[]; let flyMat, sunSprite, mistGlobal=20/64;
function buildAtmosphere(){
  const r=mulberry(646464);
  for(let i=0;i<8;i++){
    const m=new THREE.Mesh(
      new THREE.PlaneGeometry(72,26),
      new THREE.MeshBasicMaterial({map:softTex,transparent:true,opacity:0.2,depthWrite:false,fog:true,color:0xdfe9e4})
    );
    const a=r()*Math.PI*2, rr=24+r()*88;
    m.position.set(Math.sin(a)*rr, 2+r()*4, Math.cos(a)*rr);
    m.userData={f:0.7+r()*0.6, sp:0.5+r()*1.1};
    scene.add(m); mists.push(m);
  }
  const N=88;
  const pos=new Float32Array(N*3), seed=new Float32Array(N), size=new Float32Array(N);
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2, rr=8+Math.random()*64;
    pos.set([Math.sin(a)*rr, 1+Math.random()*6, Math.cos(a)*rr], i*3);
    seed[i]=Math.random()*100; size[i]=3+Math.random()*4;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  g.setAttribute('aSize',new THREE.BufferAttribute(size,1));
  flyMat=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uTime:{value:0}, uOp:{value:0.2}, uCol:{value:new THREE.Color(0xffd98a)}, uPR:{value:1} },
    vertexShader:`attribute float aSeed; attribute float aSize; uniform float uTime,uPR;
      void main(){ vec3 p=position;
        p.x+=sin(uTime*0.6+aSeed*17.0)*1.4;
        p.y+=sin(uTime*0.9+aSeed*29.0)*0.8;
        p.z+=cos(uTime*0.5+aSeed*23.0)*1.4;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_PointSize=aSize*uPR*(160.0/-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform vec3 uCol; uniform float uOp;
      void main(){ float d=length(gl_PointCoord-vec2(0.5));
        gl_FragColor=vec4(uCol, smoothstep(0.5,0.08,d)*uOp); }`,
  });
  const flies=new THREE.Points(g,flyMat); flies.frustumCulled=false; scene.add(flies);

  sunSprite=new THREE.Sprite(new THREE.SpriteMaterial({
    map:softTex, color:0xfff2d8, transparent:true, opacity:24/64,
    blending:THREE.AdditiveBlending, depthWrite:false, fog:false,
  }));
  sunSprite.scale.setScalar(46); scene.add(sunSprite);
}

canvas.addEventListener('pointerdown',e=>{ downPos=[e.clientX,e.clientY]; downTime=performance.now(); });
canvas.addEventListener('pointerup',e=>{
  if(!downPos) return;
  const moved=Math.hypot(e.clientX-downPos[0], e.clientY-downPos[1]);
  if(moved<8 && performance.now()-downTime<480){
    const rect=canvas.getBoundingClientRect();
    pointer.set(((e.clientX-rect.left)/rect.width)*2-1, -((e.clientY-rect.top)/rect.height)*2+1);
    raycaster.setFromCamera(pointer,camera);
    const hit=raycaster.intersectObjects(selectMeshes,false)[0];
    if(hit) selectSpec(hit.object.userData.spec); else closeCard();
  }
  downPos=null;
});

/* ---------- ambient sound · wind through birches ---------- */
let AC=null, master=null, audioOn=false;
document.getElementById('btnSound').addEventListener('click',e=>{
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0; master.connect(AC.destination);
    const len=AC.sampleRate*4, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.5; }
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=0.6;
    const g=AC.createGain(); g.gain.value=0.5;
    src.connect(lp); lp.connect(g); g.connect(master);
    const lfo=AC.createOscillator(); lfo.frequency.value=0.07;
    const lg=AC.createGain(); lg.gain.value=260;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const lfo2=AC.createOscillator(); lfo2.frequency.value=0.043;
    const lg2=AC.createGain(); lg2.gain.value=0.22;
    lfo2.connect(lg2); lg2.connect(g.gain); lfo2.start();
    [110,164.81,220].forEach((f,i)=>{
      const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f; o.detune.value=(i-1)*4;
      const og=AC.createGain(); og.gain.value=0.024;
      o.connect(og); og.connect(master); o.start();
    });
    src.start();
  }
  AC.resume();
  audioOn=!audioOn;
  master.gain.setTargetAtTime(audioOn?0.8:0.0, AC.currentTime, 0.6);
  e.currentTarget.classList.toggle('off',!audioOn);
});

/* ============================================================
   quality · resize · main loop
============================================================ */
const QL=[
  { dpr:Math.min(devicePixelRatio,2),   sh:true  },
  { dpr:Math.min(devicePixelRatio,1.5), sh:true  },
  { dpr:1,                              sh:false },
];
let qi = coarsePointer?1:0;
function applyQuality(){
  const q=QL[qi];
  renderer.setPixelRatio(q.dpr);
  renderer.shadowMap.enabled=q.sh;
  sun.castShadow=q.sh;
  scene.traverse(o=>{ if(o.material) o.material.needsUpdate=true; });
  if(glowMat) glowMat.uniforms.uPR.value=q.dpr;
  if(flyMat) flyMat.uniforms.uPR.value=q.dpr;
  onResize();
}
function onResize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);
}
addEventListener('resize',onResize);

const clock=new THREE.Clock();
const needle=document.getElementById('needle');
const flameM=new THREE.Matrix4(), flameQ=new THREE.Quaternion();
let introT=0, introActive=true;
const introFrom=v3(150,92,168), introTo=v3(54,30,66);
const tFrom=v3(0,12,0), tTo=v3(0,7,0);
const introDur=reducedMotion?0.8:3.4;
let ft=0, fcount=0;

function loop(){
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  /* intro glide */
  if(introActive){
    introT+=dt/introDur;
    const e=easeInOut(clamp(introT,0,1));
    camera.position.lerpVectors(introFrom,introTo,e);
    controls.target.lerpVectors(tFrom,tTo,e);
    camera.lookAt(controls.target);
    if(introT>=1){ introActive=false; controls.enabled=true; controls.autoRotate=orbitAllowed; controls.update(); }
  }else{
    controls.update();
  }

  /* target focus tween */
  if(targetTween){
    targetTween.t+=dt/1.4;
    const e=easeInOut(clamp(targetTween.t,0,1));
    controls.target.lerpVectors(targetTween.from,targetTween.to,e);
    if(targetTween.t>=1) targetTween=null;
  }

  /* mode blend */
  modeT += (modeTarget-modeT)*(1-Math.exp(-dt*2.0));
  applyMode(modeT);

  /* flames */
  for(let i=0;i<lampFlames.length;i++){
    const p=lampFlames[i];
    const s=1+0.18*Math.sin(t*11+i*3.7)+0.10*Math.sin(t*23+i*9.1);
    flameM.compose(v3(p.x,p.y+0.25*s,p.z),flameQ,v3(1,s,1));
    flameOuter.setMatrixAt(i,flameM);
    const s2=1+0.24*Math.sin(t*15+i*5.3);
    flameM.compose(v3(p.x,p.y+0.18*s2,p.z),flameQ,v3(1,s2,1));
    flameInner.setMatrixAt(i,flameM);
  }
  flameOuter.instanceMatrix.needsUpdate=true;
  flameInner.instanceMatrix.needsUpdate=true;
  glowMat.uniforms.uTime.value=t;
  flyMat.uniforms.uTime.value=t;
  lampLights.forEach((L,i)=>{ L.intensity=lampBase*(0.8+0.2*Math.sin(t*12+i*4.1)); });

  /* water shimmer */
  bumpTex.offset.x-=dt*0.03;
  bumpTexPool.offset.x-=dt*0.008; bumpTexPool.offset.y+=dt*0.006;

  /* mist drift, yaw-billboarded */
  for(const m of mists){
    m.position.x+=m.userData.sp*dt;
    if(m.position.x>120) m.position.x=-120;
    m.rotation.y=Math.atan2(camera.position.x-m.position.x, camera.position.z-m.position.z);
    m.material.opacity=mistGlobal*m.userData.f;
  }

  /* canoes */
  for(const c of canoes){
    if(c.moored){ c.g.position.y=waterY(47.5)+0.3+0.07*Math.sin(t*1.2+c.ph); c.g.rotation.z=0.05*Math.sin(t*0.9+c.ph); continue; }
    c.t=(c.t+dt*c.sp)%1;
    const p=riverSpline.getPointAt(c.t), tan=riverSpline.getTangentAt(c.t);
    const side=v3(0,0,0).crossVectors(v3(0,1,0),tan).normalize().multiplyScalar(c.side);
    c.g.position.set(p.x+side.x, p.y+0.3+0.08*Math.sin(t*1.3+c.ph), p.z+side.z);
    c.g.lookAt(p.x+tan.x+side.x, c.g.position.y, p.z+tan.z+side.z);
    c.g.rotation.z=0.05*Math.sin(t*0.9+c.ph);
  }

  /* selection pulse */
  if(sel) sel.frameMat.emissiveIntensity=0.5+0.3*Math.sin(t*4.2);

  /* compass */
  needle.style.transform='rotate('+(-controls.getAzimuthalAngle()*180/Math.PI)+'deg)';

  renderer.render(scene,camera);

  /* adaptive quality */
  ft+=dt; fcount++;
  if(fcount>=96){
    if(ft/fcount>0.034 && qi<QL.length-1){ qi++; applyQuality(); }
    ft=0; fcount=0;
  }
}

/* ============================================================
   boot · staged so the loading veil feels earned
============================================================ */
const barFill=document.getElementById('barFill');
const loadCap=document.getElementById('loadCap');
async function step(cap,pct){
  loadCap.textContent=cap; barFill.style.width=pct+'%';
  await nextFrame(); await nextFrame();
}
(async function boot(){
  try{
    applyQuality();
    await step('Seeding the terrain',10); buildGround(); buildWater();
    await step('Laying the stone ways',26); buildPaths(); buildLamps();
    await step('Raising the spires',46); buildCity();
    await step('Planting the birches',66); buildForest();
    await step('Binding the mist',84); buildAtmosphere(); buildCanoes();
    applyMode(0);
    await step('Opening the vale',100);
    renderer.render(scene,camera);
    renderer.setAnimationLoop(loop);
    await nextFrame();
    document.getElementById('load').classList.add('done');
    setTimeout(()=>document.getElementById('hint').classList.add('hide'), 8000);
  }catch(err){
    loadCap.textContent='This vessel needs WebGL to sail';
    console.error(err);
  }
})();
</script>
