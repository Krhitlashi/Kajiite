<!DOCTYPE html>
<!-- ⟨ ឧបករណ៍ចាក់ចម្រៀង 🎧 ៖ បញ្ជីវិលទាំង 0o7 ជាមួយប៊ូតុងចាក់ ផ្អាក បញ្ឈប់
     កម្រិតសំឡេង និងគំនូសរំកិលទៅមុខតំណែងក្នុងបទ ។ វាប្រើម៉ាស៊ីនលេងតន្ត្រីពិតរបស់ហ្គេម ( ludilo ) ដូច្នេះ
     សំឡេងដែលឮគឺដូចគ្នានឹងក្នុងហ្គេម ។ រយៈពេលបង្ហាញជាហេ ។ 📃 ⟩ -->
<html lang="km">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title> ឧបករណ៍ចាក់ចម្រៀង 🎧 </title>
<link rel="stylesheet" href="https://krhitlashi.github.io/%D6%AD%C5%BF%C9%AD%E1%B4%9C%20%C4%B1__%C9%94.css">
<link rel="stylesheet" href="../stiloj.css">
</head>
<body class="cepufal">
  <thala class="n2tase">
    <p class="ksakap2sa"> ឧបករណ៍ចាក់ចម្រៀង 🎧 </p>
    <sabosuc2w2q class="transporto">
      <button id="baskuli" aria-label="ចាក់ ឬផ្អាក"> ▶ </button>
      <button id="halti" aria-label="បញ្ឈប់"> ⏹ </button>
    </sabosuc2w2q>
    <label> កម្រិតសំឡេង <output id="volVal"> 1 </output> </label>
    <input id="volumo" type="range" min="0" max="1" step="0.01" value="1" aria-label="កម្រិតសំឡេង">
  </thala>
  <thala class="n2tase">
    <p class="ksakap2sa"> កំពុងចាក់ 🎵 </p>
    <p id="nunaTitolo"> — </p>
    <p id="nunaInstrs" class="kefhuruq"> </p>
    <input id="progreso" type="range" min="0" max="1" step="1" value="0" aria-label="មុខតំណែងក្នុងបទ">
    <p id="tempo" class="kefhuruq"> 0o0 / 0o0 ហេ </p>
    <p id="sekcio" class="ksakat2xa"> </p>
  </thala>
  <thala class="n2tase">
    <p class="ksakap2sa"> បទចម្រៀង 📜 </p>
    <maxema id="trakListo"> </maxema>
    <p class="kefhuruq"> ចុចបទណាមួយដើម្បីចាក់ ។ បទឈប់ពេលចប់ ។ </p>
  </thala>
  <thala class="n2tase">
    <p class="ksakap2sa"> សំឡេងឧបករណ៍ 🎛️ </p>
    <sabosuc2w2q class="qox2n2kucaxema" id="sonListo"> </sabosuc2w2q>
    <p class="kefhuruq"> ចុចឧបករណ៍ណាមួយដើម្បីស្ដាប់សំឡេងរបស់វា ។ ពេលចាក់បទ ឧបករណ៍កំពុងលេងនឹងប្លែងនៅទីនេះ និងក្នុងបញ្ជីខាងលើ ។ </p>
  </thala>
<script type="module" src="./muzikilo.ts"> </script>
</body>
</html>
