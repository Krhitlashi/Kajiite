<!DOCTYPE html>
<html lang="aih">
<head>
<meta charset="utf-8"/>

<title data-oskakefani="titoloAranis">ARANIS · ꞁȷ̀ɹ ֭ſɭɹɔ˞ j͐ʃɜ ɭʃᴜ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://krhitlashi.github.io/%D6%AD%C5%BF%C9%AD%E1%B4%9C%20%C4%B1__%C9%94.css">
<link rel="stylesheet" href="./stiloj.css">
<script src="https://krhitlashi.github.io/%C5%BF%C9%9F%E1%B4%9C%20%C5%BF%C9%AD%C9%94%20j%CD%91%CA%83%27%C9%94/%C5%BF%C9%AD%C9%94%20j%CD%91%CA%83%27%C9%94%20%7D%CA%83%EA%9E%87.js"></script>
<script type="module" src="./src/tradukoj.ts"></script>
</head>
<body>
<canvas id="sceno" aria-label="Aranis, mergan 3D urbo en nebula betularo"></canvas>

<!-- ⟪ Vinjeto 📃 ⟫ -->
<div id="vinjeto"></div>

<!-- ⟪ Svingo ( ora lumo-fluo ) 📃 ⟫ -->
<div id="svingo" aria-hidden="true"></div>

<!-- ⟪ Koloraj supermetoj 📃 ⟫ -->
<div id="fxVarma" aria-hidden="true"></div>
<div id="fxMenta" aria-hidden="true"></div>

<!-- ⟪ Retikulo 📃 ⟫ -->
<div id="retikulo"></div>

<!-- ⟪ Balaila transiro 📃 ⟫ -->
<div id="balailo"></div>

<!-- ⟪ Tosto 📃 ⟫ -->
<div id="tosto" class="aih"></div>

<!-- ⟪ Minimapo ( la kompaso fariĝis radara mapo; klako malfermas la plenan vidon ) 📃 ⟫ -->
<div id="kompaso" role="button" tabindex="0" aria-label="Mapo de Aranis" aria-pressed="false">
  <canvas id="minimapaKanvaso"></canvas>
  <div class="nadlo" id="nadlo"><span data-oskakefani="kompasoNordo">N</span></div>
</div>
<thala id="karto" class="aih">
  <h2 id="kartoNomo"></h2>
  <span class="peco" id="kartoChip"></span>
  <div class="statistikoj" id="kartoStatistikoj"></div>
  <div class="gusto" id="kartoFlavor"></div>
  <div class="karto-agoj">
    <button id="kartoEniri" data-oskakefani="eniri">Eniri</button>
  </div>
</thala>
<!-- ⟪ Naviga butono ( malfermas pop-up ) 📃 ⟫ -->
<button id="navButono" class="n2tase" data-oskakefani-aria="ariaNavButono" aria-label="Menuo">二</button>

<!-- ⟪ Pop-up navigado 📃 ⟫ -->
<div id="navPopUp">
  <thala class="menuPanel aih">
    <div class="menuIdenteco">
      <h1 data-oskakefani="titoloAranis">ARANIS · La Nebula Valo</h1>
      <p data-oskakefani="subtitoloUrbo">La Nebula Valo · Urbo-Sxtupo de la Betularo</p>
    </div>
    <div class="menuAzioj">
      <button id="butRezimo">PROMENI</button>
      <button id="butVesti" data-oskakefani="butonoVestaro" data-oskakefani-aria="ariaButVesti">VESTARO</button>
      <button id="butHelpi" data-oskakefani="butonoHelpo" data-oskakefani-aria="ariaButHelpi">?</button>
      <button id="butLingvo" data-oskakefani-aria="ariaButLingvo">AIH</button>
      <button id="butSonoro" data-oskakefani-aria="ariaButSonoro">♬</button>
      <button id="butBruo" data-oskakefani-aria="ariaButBruo">≋</button>
    </div>
    <ciihii id="muzikoGrupo">
      <label id="muzikoEtikedo" data-oskakefani="muziko">MUZIKO</label>
      <div id="trakaVico">
        <button class="trakaBut" data-trako="0" data-oskakefani-aria="ariaTrako0">1</button>
        <button class="trakaBut" data-trako="1" data-oskakefani-aria="ariaTrako1">2</button>
        <button class="trakaBut" data-trako="2" data-oskakefani-aria="ariaTrako2">3</button>
        <button class="trakaBut" data-trako="3" data-oskakefani-aria="ariaTrako3">4</button>
      </div>
    </ciihii>
    <div class="menuKrepusko">
      <button id="butKrepusko" data-oskakefani-aria="ariaButKrepusko">☽</button>
      <ciihii id="duskLabelo">☽ <input type="range" id="duskRegilo" min="0" max="1" step="0.01" value="0" data-oskakefani-aria="ariaDuskRegilo"> ☀</ciihii>
    </div>
  </thala>
</div>
<!-- ⟪ Poŝtelefonaj kontroloj 📃 ⟫ -->
<div id="mobKontroloj" aria-hidden="true">
  <div id="mobJoystickZono">
    <div id="mobJoystickBazo">
      <div id="mobJoystickTenilo"></div>
    </div>
  </div>
  <div id="mobButaroj">
    <button id="mobButInterakti" class="mobBut n2tase" data-oskakefani-aria="ariaButInterakti">E</button>
    <button id="mobButSalti" class="mobBut n2tase" data-oskakefani-aria="ariaButSalti">⟐</button>
  </div>
</div>

<div id="prompto" class="aih"></div>
<div id="supermeta">
  <button id="supermetaFermi" class="n2tase" data-oskakefani-aria="ariaSupermetaFermi">川</button>
  <thala class="interno aih">
    <h3 id="supermetaTitolo" data-oskakefani="titoloTeksilo">LA TEKSILO</h3>
    <div class="supra" id="supermetaSupra" data-oskakefani="subtitoloTeksilo">Longaj cxemizoj · mallongaj manikoj · cxefa kaj akcenta</div>
    <div class="vestaVico" id="vestaVico"></div>
  </thala>
</div>
<div id="sxargxo">
  <div class="ltitle aih" id="sxargxaTitolo" data-oskakefani="titoloSxargxo">ARANIS</div>
  <div class="stango"><i id="stangoPlenigo"></i></div>
  <div class="lsupra aih" id="loadCap" data-oskakefani="sxargxaSubskribo">j͐ʃɜ ɭʃᴜ ſɭɔƽ</div>
</div>
<script type="module" src="./src/sperto.ts"></script>

</html>
